title: "我的编程博客"
description: "项目复盘与学习笔记"
author: "Mogmoug"
lang: "zh-CN"
timezone: "Asia/Shanghai"

url: "https://mogmoug.github.io"
baseurl: ""

remote_theme: daattali/beautiful-jekyll

permalink: "/:year/:month/:day/:title/"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor