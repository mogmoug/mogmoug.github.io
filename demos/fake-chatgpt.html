<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT 多会话版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            height: 100vh;
            background-color: #f7f7f8;
        }
        
        .sidebar {
            width: 260px;
            background-color: #f0f0f0;
            border-right: 1px solid #e5e5e6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .new-chat-btn {
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .new-chat-btn:hover {
            background-color: #0d8a6d;
        }
        
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .conversation-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-item:hover {
            background-color: #e5e5e6;
        }
        
        .conversation-item.active {
            background-color: #e0e0e0;
            font-weight: 500;
        }
        
        .conversation-item .icon {
            margin-right: 8px;
            color: #6e6e80;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e6;
            background-color: #ffffff;
            display: flex;
            align-items: center;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f7f7f8;
        }
        
        .message {
            display: flex;
            max-width: 800px;
            margin: 0 auto 20px;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 3px;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        
        .user-avatar {
            background-color: #10a37f;
        }
        
        .bot-avatar {
            background-color: #6e6e80;
        }
        
        .message-content {
            flex: 1;
            padding-top: 6px;
        }
        
        .message-role {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .message-text {
            line-height: 1.5;
            white-space: pre-wrap;
        }
        
        .input-container {
            padding: 12px 16px;
            border-top: 1px solid #e5e5e6;
            background-color: #ffffff;
        }
        
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        textarea {
            width: 100%;
            border: 1px solid #e5e5e6;
            border-radius: 6px;
            padding: 12px 50px 12px 16px;
            resize: none;
            outline: none;
            font-size: 16px;
            min-height: 60px;
            max-height: 200px;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            border-color: #10a37f;
        }
        
        .send-button {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .send-button:hover {
            background-color: #0d8a6d;
        }
        
        .send-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: inline-block;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #6e6e80;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: typing 1s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .message {
                max-width: 100%;
            }
            
            .avatar {
                width: 30px;
                height: 30px;
                margin-right: 12px;
            }
            
            .message-content {
                padding-top: 3px;
            }
        }
        
        @media (max-width: 576px) {
            body {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #e5e5e6;
            }
            
            .main-content {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>会话列表</h2>
            <button class="new-chat-btn" id="newChatBtn">新建会话</button>
        </div>
        <div class="conversation-list" id="conversationList">
            <!-- 会话列表将在这里动态生成 -->
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1 id="currentConversationTitle">新会话</h1>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <!-- 对话内容将在这里动态生成 -->
        </div>
        
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="输入消息..." rows="1"></textarea>
                <button class="send-button" id="sendButton" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const newChatBtn = document.getElementById('newChatBtn');
            const conversationList = document.getElementById('conversationList');
            const currentConversationTitle = document.getElementById('currentConversationTitle');
            
            // 会话数据
            let conversations = [];
            let currentConversationId = null;
            
            // 从本地存储加载会话
            loadConversations();
            
            // 如果没有会话，创建一个新的
            if (conversations.length === 0) {
                createNewConversation();
            } else {
                // 默认加载第一个会话
                switchConversation(conversations[0].id);
            }
            
            // 自动调整文本框高度
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                
                // 启用/禁用发送按钮
                sendButton.disabled = this.value.trim() === '';
            });
            
            // 按Enter发送消息，Shift+Enter换行
            userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendButton.disabled) {
                        sendMessage();
                    }
                }
            });
            
            // 点击发送按钮
            sendButton.addEventListener('click', sendMessage);
            
            // 新建会话按钮
            newChatBtn.addEventListener('click', createNewConversation);
            
            function createNewConversation() {
                const newId = generateId();
                const newConversation = {
                    id: newId,
                    title: `会话 ${conversations.length + 1}`,
                    messages: [],
                    createdAt: new Date().toISOString()
                };
                
                conversations.push(newConversation);
                saveConversations();
                renderConversationList();
                switchConversation(newId);
                
                // 清空输入框
                userInput.value = '';
                userInput.style.height = 'auto';
                sendButton.disabled = true;
                
                // 添加欢迎消息
                addMessage('assistant', '你好！我是AI助手，有什么可以帮你的吗？');
            }
            
            function switchConversation(conversationId) {
                currentConversationId = conversationId;
                const conversation = conversations.find(c => c.id === conversationId);
                
                if (!conversation) return;
                
                // 更新标题
                currentConversationTitle.textContent = conversation.title;
                
                // 清空聊天容器
                chatContainer.innerHTML = '';
                
                // 加载消息
                conversation.messages.forEach(msg => {
                    addMessage(msg.role, msg.content, false, false);
                });
                
                // 更新活动会话样式
                document.querySelectorAll('.conversation-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.id === conversationId);
                });
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                // 获取当前会话
                const conversation = conversations.find(c => c.id === currentConversationId);
                if (!conversation) return;
                
                // 添加用户消息
                addMessage('user', message);
                conversation.messages.push({ role: 'user', content: message });
                
                // 如果是第一条消息，更新会话标题
                if (conversation.messages.length === 1) {
                    conversation.title = message.slice(0, 30) + (message.length > 30 ? '...' : '');
                    currentConversationTitle.textContent = conversation.title;
                    renderConversationList();
                }
                
                userInput.value = '';
                userInput.style.height = 'auto';
                sendButton.disabled = true;
                
                // 显示AI正在输入
                const botResponseId = addMessage('assistant', '', true);
                
                // 模拟AI响应延迟
                setTimeout(() => {
                    // 这里可以替换为实际的API调用
                    const responses = [
                        "我明白了。关于这个问题，我认为...",
                        "这是一个有趣的问题。让我想想...",
                        "根据我的知识，我可以告诉你...",
                        "感谢你的提问。我的看法是...",
                        "这个问题很有深度。我的理解是..."
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    
                    // 模拟逐字显示效果
                    simulateTyping(botResponseId, randomResponse, () => {
                        // 打字完成后保存消息
                        conversation.messages.push({ role: 'assistant', content: randomResponse });
                        saveConversations();
                    });
                }, 1000);
                
                // 保存会话
                saveConversations();
            }
            
            function addMessage(role, content, isTyping = false, saveToHistory = true) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = `avatar ${role}-avatar`;
                avatarDiv.textContent = role === 'user' ? '你' : 'AI';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                
                const roleDiv = document.createElement('div');
                roleDiv.className = 'message-role';
                roleDiv.textContent = role === 'user' ? '你' : 'ChatGPT';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                
                if (isTyping) {
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'typing-indicator';
                    typingDiv.innerHTML = '<span></span><span></span><span></span>';
                    textDiv.appendChild(typingDiv);
                    textDiv.dataset.typing = 'true';
                } else {
                    textDiv.textContent = content;
                }
                
                contentDiv.appendChild(roleDiv);
                contentDiv.appendChild(textDiv);
                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(contentDiv);
                
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // 返回消息元素用于后续更新
                return textDiv;
            }
            
            function simulateTyping(element, fullText, onComplete) {
                if (element.dataset.typing === 'true') {
                    element.innerHTML = '';
                    element.dataset.typing = 'false';
                }
                
                let i = 0;
                const speed = 20 + Math.random() * 30; // 随机速度
                
                function typeWriter() {
                    if (i < fullText.length) {
                        element.textContent += fullText.charAt(i);
                        i++;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        setTimeout(typeWriter, speed);
                    } else if (onComplete) {
                        onComplete();
                    }
                }
                
                typeWriter();
            }
            
            function renderConversationList() {
                conversationList.innerHTML = '';
                
                // 按创建时间排序
                conversations.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                conversations.forEach(conversation => {
                    const item = document.createElement('div');
                    item.className = `conversation-item ${conversation.id === currentConversationId ? 'active' : ''}`;
                    item.dataset.id = conversation.id;
                    item.innerHTML = `
                        <span class="icon">💬</span>
                        <span>${conversation.title}</span>
                    `;
                    
                    item.addEventListener('click', () => {
                        switchConversation(conversation.id);
                    });
                    
                    conversationList.appendChild(item);
                });
            }
            
            function saveConversations() {
                localStorage.setItem('chatConversations', JSON.stringify(conversations));
            }
            
            function loadConversations() {
                const saved = localStorage.getItem('chatConversations');
                if (saved) {
                    conversations = JSON.parse(saved);
                }
            }
            
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substring(2);
            }
        });
    </script>
</body>
</html>
