                // 点击桌面空白处取消选中
                if (e.target.id === 'desktop' || e.target.id === 'desktop-icons') {
                    clearDesktopSelection();
                }
                // 点击文件列表空白处取消选中
                if (e.target.classList.contains('explorer-files') || e.target.closest('.explorer-files') === e
                    .target) {
                    const fileList = e.target.classList.contains('explorer-files') ? e.target : e.target.closest(
                        '.explorer-files');
                    if (fileList) {
                        fileList.querySelectorAll('.file-item.selected').forEach(el => el.classList.remove(
                            'selected'));
                    }
                }
            });

            // 全局快捷键
            document.addEventListener('keydown', function(e) {
                // Delete键删除选中的桌面图标
                if (e.key === 'Delete') {
                    const selectedIcon = document.querySelector('#desktop-icons .desktop-icon.selected');
                    if (selectedIcon && document.activeElement === document.body) {
                        const filePath = selectedIcon.getAttribute('data-desktop-path');
                        if (filePath) {
                            const name = fsName(filePath);
                            showConfirmDialog('删除确认', `确定要删除 "${name}" 吗？`, () => {
                                fsDelete(filePath);
                                refreshDesktopIcons();
                                refreshAllExplorers();
                            }, true);
                        }
                    }
                }
                // F5刷新
                if (e.key === 'F5' && document.activeElement === document.body) {
                    e.preventDefault();
                    refreshDesktopIcons();
                    refreshAllExplorers();
                    showToast('已刷新');
                }
            });

            // ============ 任务栏时钟 ============
            function updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit',
                    weekday: 'short' });
                document.getElementById('taskbar-clock').innerHTML = `${timeStr}<br><span style="font-size:10px;">${dateStr}</span>`;
            }
            updateClock();
            setInterval(updateClock, 10000);

            // ============ 工具函数 ============
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ 初始化 ============
            function init() {
                fsEnsureInit();
                refreshDesktopIcons();
                // 默认打开一个文件资源管理器
                setTimeout(() => {
                    openExplorerWindow('C:/Users/Default/Desktop');
                }, 300);
            }

            // 暴露到全局
            window.openExplorerWindow = openExplorerWindow;
            window.openNotepadWindow = openNotepadWindow;
            window.openNewNotepad = openNewNotepad;
            window.refreshDesktopIcons = refreshDesktopIcons;
            window.refreshAllExplorers = refreshAllExplorers;
            window.closeAllContextMenus = closeAllContextMenus;
            window.fsExists = fsExists;
            window.fsIsFolder = fsIsFolder;
            window.fsName = fsName;

            init();
            console.log('🪟 Windows 模拟系统已就绪');
            console.log('  - 双击桌面图标打开文件/文件夹');
            console.log('  - 右键显示上下文菜单');
            console.log('  - 拖拽窗口标题栏移动窗口');
            console.log('  - 右下角拖拽调整窗口大小');
            console.log('  - Ctrl+S 在记事本中保存');
            console.log('  - 数据自动保存到浏览器本地存储');
            console.log('💾 文件系统存储在 localStorage: ' + STORAGE_KEY);
        })();
    </script>
</body>
</html>
