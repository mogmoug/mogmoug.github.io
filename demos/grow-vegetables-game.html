<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 阳光菜园 - 休闲种菜游戏</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --soil: #c9a87c;
            --soil-dark: #b8956a;
            --soil-light: #dcc9a8;
            --card-bg: #ffffff;
            --text: #4a3728;
            --text-light: #6b5d4f;
            --gold: #e8a817;
            --gold-light: #f5c842;
            --green: #6b9b4f;
            --green-light: #8bc06a;
            --red: #e05555;
            --red-light: #f07070;
            --blue: #5b8ec9;
            --blue-light: #7aacf0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.14);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(160deg, #e8e0d3 0%, #f0ebe0 30%, #e5ddd0 60%, #f2ede4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -80px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(139, 192, 106, 0.13) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -60px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(245, 200, 66, 0.11) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.5);
            padding: 28px 26px 22px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ========== 顶部栏 ========== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }
        .game-title {
            font-size: 1.7em;
            font-weight: 700;
            color: #4a6e3a;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-title .icon {
            font-size: 1.3em;
            animation: bounce-gentle 2s ease-in-out infinite;
        }
        @keyframes bounce-gentle {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-5px);
            }
        }
        .stats-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fffef9;
            border: 1.5px solid #e8dcc8;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .stat-badge.gold-badge {
            border-color: #f0d78c;
            background: linear-gradient(135deg, #fffef5, #fff8e0);
        }
        .stat-badge .badge-icon {
            font-size: 1.3em;
        }
        .stat-badge .badge-value {
            font-size: 1.15em;
            font-weight: 700;
            color: #b8781a;
            min-width: 28px;
            text-align: center;
            transition: var(--transition);
        }
        .stat-badge .badge-value.pulse {
            animation: pop-num 0.4s ease-out;
        }
        @keyframes pop-num {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.35);
                color: #e8a817;
            }
            100% {
                transform: scale(1);
            }
        }

        /* ========== 主布局 ========== */
        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ========== 种子面板 ========== */
        .seed-panel {
            flex: 0 0 170px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .seed-panel-title {
            font-weight: 700;
            font-size: 0.9em;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 2px;
            padding-left: 4px;
        }
        .seed-card {
            background: var(--card-bg);
            border: 2px solid #e8e0d4;
            border-radius: var(--radius);
            padding: 13px 12px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            box-shadow: var(--shadow-sm);
            outline: none;
        }
        .seed-card:hover {
            border-color: #c9b896;
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .seed-card:active {
            transform: scale(0.97);
        }
        .seed-card.selected {
            border-color: #6b9b4f;
            background: #f6faf3;
            box-shadow: 0 0 0 5px rgba(107, 155, 79, 0.12);
            animation: selected-glow 2s ease-in-out infinite;
        }
        @keyframes selected-glow {
            0%,
            100% {
                box-shadow: 0 0 0 5px rgba(107, 155, 79, 0.12);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(107, 155, 79, 0.04);
            }
        }
        .seed-card .seed-emoji {
            font-size: 2.2em;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .seed-card.selected .seed-emoji {
            animation: wiggle 0.5s ease-in-out;
        }
        @keyframes wiggle {
            0%,
            100% {
                transform: rotate(0);
            }
            25% {
                transform: rotate(-12deg);
            }
            50% {
                transform: rotate(10deg);
            }
            75% {
                transform: rotate(-6deg);
            }
        }
        .seed-card .seed-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .seed-card .seed-name {
            font-weight: 700;
            font-size: 0.95em;
            color: var(--text);
            white-space: nowrap;
        }
        .seed-card .seed-meta {
            font-size: 0.75em;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .seed-card .seed-cost {
            font-weight: 600;
            color: #b8781a;
            font-size: 0.8em;
        }
        .seed-card .seed-time {
            font-size: 0.7em;
            color: #888;
        }
        .seed-card .seed-tag {
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 0.65em;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
            letter-spacing: 0.03em;
            pointer-events: none;
        }
        .tag-fast {
            background: #6b9b4f;
        }
        .tag-high {
            background: #e8a817;
        }
        .tag-steady {
            background: #5b8ec9;
        }
        .tag-bonus {
            background: #e05555;
        }

        /* ========== 田地区域 ========== */
        .farm-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .farm-title {
            font-weight: 700;
            font-size: 0.9em;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding-left: 4px;
        }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            background: #e8dcc8;
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 3px solid #d9c9a8;
            position: relative;
        }
        /* 田地纹理 */
        .farm-grid::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 14px;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 75% 60%, rgba(0, 0, 0, 0.03) 0%, transparent 35%),
                radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.04) 0%, transparent 30%);
            z-index: 0;
        }

        .plot {
            position: relative;
            z-index: 1;
            aspect-ratio: 1 / 1;
            background: var(--soil);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            border: 2.5px solid transparent;
            overflow: hidden;
            min-width: 60px;
            min-height: 60px;
        }
        .plot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            pointer-events: none;
            background: radial-gradient(ellipse at 40% 35%, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            z-index: 2;
            transition: var(--transition);
        }
        .plot:hover {
            box-shadow: var(--shadow), inset 0 1px 3px rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .plot:active {
            transform: scale(0.94);
            transition: 0.08s;
        }
        .plot.empty-plot {
            background: var(--soil);
            border-color: transparent;
        }
        .plot.empty-plot.has-seed-selected:hover {
            border-color: rgba(107, 155, 79, 0.6);
            box-shadow: var(--shadow), 0 0 0 6px rgba(107, 155, 79, 0.1);
            background: #d4bfa0;
        }
        .plot.empty-plot.has-seed-selected::before {
            content: '✨';
            position: absolute;
            font-size: 1.4em;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition);
            animation: float-hint 2s ease-in-out infinite;
        }
        .plot.empty-plot.has-seed-selected:hover::before {
            opacity: 0.9;
        }
        @keyframes float-hint {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-8px);
                opacity: 0.9;
            }
        }
        .plot.planted-plot {
            background: #bfa07d;
            border-color: rgba(139, 192, 106, 0.3);
        }
        .plot.planted-plot:hover {
            border-color: rgba(107, 155, 79, 0.55);
            box-shadow: var(--shadow), 0 0 0 5px rgba(107, 155, 79, 0.08);
        }
        .plot.mature-plot {
            background: #c8a87a;
            border-color: #f5c842 !important;
            animation: mature-pulse 1.5s ease-in-out infinite;
            cursor: pointer;
        }
        .plot.mature-plot:hover {
            border-color: #e8a817 !important;
            box-shadow: var(--shadow-lg), 0 0 20px rgba(245, 200, 66, 0.45) !important;
            transform: translateY(-4px) !important;
        }
        @keyframes mature-pulse {
            0%,
            100% {
                box-shadow: var(--shadow-sm), 0 0 8px rgba(245, 200, 66, 0.35);
            }
            50% {
                box-shadow: var(--shadow), 0 0 22px rgba(245, 200, 66, 0.6);
            }
        }
        .plot .plot-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            pointer-events: none;
        }
        .plot .plant-emoji {
            font-size: 2.6em;
            transition: all var(--transition);
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15));
        }
        .plot.mature-plot .plant-emoji {
            font-size: 3em;
            animation: bounce-ready 0.7s ease-in-out infinite;
        }
        @keyframes bounce-ready {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-10px) scale(1.08);
            }
            50% {
                transform: translateY(0) scale(1.02);
            }
            70% {
                transform: translateY(-4px) scale(1.04);
            }
        }
        .plot .progress-bar-wrap {
            width: 75%;
            height: 5px;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 10px;
            overflow: hidden;
            pointer-events: none;
        }
        .plot .progress-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #8bc06a, #6b9b4f);
            transition: width 0.3s ease-out;
        }
        .plot .watered-indicator {
            position: absolute;
            top: 5px;
            right: 7px;
            font-size: 0.85em;
            z-index: 4;
            pointer-events: none;
            opacity: 0.8;
            animation: drip 1.5s ease-in-out infinite;
        }
        @keyframes drip {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            50% {
                transform: translateY(3px);
                opacity: 1;
            }
        }
        .plot .fertilized-indicator {
            position: absolute;
            top: 5px;
            left: 7px;
            font-size: 0.75em;
            z-index: 4;
            pointer-events: none;
            opacity: 0.7;
        }

        /* ========== 工具栏 ========== */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            padding-top: 4px;
        }
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            background: #fffef9;
            box-shadow: var(--shadow-sm);
            color: var(--text);
            position: relative;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .tool-btn:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .tool-btn:active {
            transform: scale(0.95);
            transition: 0.08s;
        }
        .tool-btn.water-btn {
            border-color: #c9ddf5;
            color: #3d6fa0;
        }
        .tool-btn.water-btn:hover {
            border-color: #a3c8ed;
            background: #f6fafe;
        }
        .tool-btn.water-btn.on-cooldown {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            border-color: #e0d8cc;
            color: #aaa;
            background: #f8f6f2;
        }
        .tool-btn.fertilize-btn {
            border-color: #f0d78c;
            color: #8b6914;
        }
        .tool-btn.fertilize-btn:hover {
            border-color: #e8c44a;
            background: #fffef6;
        }
        .tool-btn.fertilize-btn.active-mode {
            background: #fff8dc;
            border-color: #e8a817;
            box-shadow: 0 0 0 6px rgba(232, 168, 23, 0.13);
            animation: fert-glow 1.8s ease-in-out infinite;
        }
        @keyframes fert-glow {
            0%,
            100% {
                box-shadow: 0 0 0 6px rgba(232, 168, 23, 0.13);
            }
            50% {
                box-shadow: 0 0 0 13px rgba(232, 168, 23, 0.03);
            }
        }
        .tool-btn.fertilize-btn.on-cooldown {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            border-color: #e0d8cc;
            color: #aaa;
            background: #f8f6f2;
        }
        .cooldown-badge {
            font-size: 0.75em;
            font-weight: 700;
            color: #c0392b;
            min-width: 20px;
            text-align: center;
        }

        .hint-text {
            font-size: 0.8em;
            color: #999;
            text-align: center;
            min-height: 20px;
            transition: all var(--transition);
            letter-spacing: 0.03em;
        }
        .hint-text.flash {
            color: #e05555;
            animation: flash-hint 0.6s ease-out;
        }
        @keyframes flash-hint {
            0% {
                opacity: 0;
                transform: translateY(4px);
            }
            50% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 浮动文字 */
        .floating-text {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-weight: 700;
            font-size: 1.2em;
            animation: float-up 1.1s ease-out forwards;
            white-space: nowrap;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            30% {
                opacity: 1;
                transform: translateY(-25px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-70px) scale(0.7);
            }
        }
        .floating-text.gold-text {
            color: #e8a817;
            font-size: 1.4em;
        }
        .floating-text.water-text {
            color: #5b8ec9;
            font-size: 1em;
        }
        .floating-text.fert-text {
            color: #8b6914;
            font-size: 1em;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .main-layout {
                flex-direction: column;
                align-items: stretch;
            }
            .seed-panel {
                flex: 0 0 auto;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }
            .seed-panel-title {
                width: 100%;
                text-align: center;
                margin-bottom: 0;
            }
            .seed-card {
                flex: 1 1 auto;
                min-width: 70px;
                padding: 10px 8px;
                gap: 6px;
                justify-content: center;
            }
            .seed-card .seed-emoji {
                font-size: 1.6em;
            }
            .seed-card .seed-info {
                gap: 0;
            }
            .seed-card .seed-name {
                font-size: 0.8em;
            }
            .seed-card .seed-meta {
                font-size: 0.7em;
            }
            .seed-card .seed-tag {
                font-size: 0.6em;
                padding: 2px 6px;
                top: -5px;
                right: -2px;
            }
            .farm-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 8px;
                padding: 10px;
            }
            .plot {
                min-width: 45px;
                min-height: 45px;
                border-radius: 8px;
            }
            .plot .plant-emoji {
                font-size: 1.8em;
            }
            .plot.mature-plot .plant-emoji {
                font-size: 2.2em;
            }
            .game-container {
                padding: 16px 12px 14px;
                gap: 14px;
            }
            .game-title {
                font-size: 1.3em;
            }
            .tool-btn {
                padding: 9px 14px;
                font-size: 0.8em;
                gap: 4px;
            }
        }
        @media (max-width: 400px) {
            .farm-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 6px;
                padding: 8px;
            }
            .plot {
                min-width: 38px;
                min-height: 38px;
                border-radius: 6px;
            }
            .plot .plant-emoji {
                font-size: 1.5em;
            }
            .plot.mature-plot .plant-emoji {
                font-size: 1.8em;
            }
            .plot .progress-bar-wrap {
                width: 65%;
                height: 3px;
            }
            .seed-card {
                padding: 8px 6px;
                gap: 4px;
            }
            .seed-card .seed-emoji {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="game-title">
                <span class="icon">🌻</span>阳光菜园
            </div>
            <div class="stats-row">
                <div class="stat-badge gold-badge" id="goldBadge">
                    <span class="badge-icon">🪙</span>
                    <span>金币:</span>
                    <span class="badge-value" id="goldDisplay">50</span>
                </div>
                <div class="stat-badge" id="harvestBadge">
                    <span class="badge-icon">🧺</span>
                    <span>收获:</span>
                    <span class="badge-value" id="harvestCount">0</span>
                </div>
            </div>
        </div>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 种子面板 -->
            <div class="seed-panel" id="seedPanel">
                <div class="seed-panel-title">🌱 选择种子</div>
                <!-- 种子卡片由JS动态生成 -->
            </div>

            <!-- 田地 -->
            <div class="farm-area">
                <div class="farm-title">🏡 我的菜园</div>
                <div class="farm-grid" id="farmGrid">
                    <!-- 12块地由JS动态生成 -->
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <button class="tool-btn water-btn" id="waterBtn" title="点击生长中的植物进行浇水（加速20%）">
                💧 浇水
                <span class="cooldown-badge" id="waterCdBadge" style="display:none;"></span>
            </button>
            <button class="tool-btn fertilize-btn" id="fertilizeBtn" title="花费10金币施肥（加速40%），每株限1次">
                🧪 施肥 (10🪙)
                <span class="cooldown-badge" id="fertCdBadge" style="display:none;"></span>
            </button>
        </div>
        <div class="hint-text" id="hintText">👆 选择种子，然后点击空地开始种植吧！</div>
    </div>

    <script>
        (function() {
            // ==================== 游戏配置 ====================
            const SEED_TYPES = {
                carrot: {
                    id: 'carrot',
                    name: '胡萝卜',
                    emoji: '🥕',
                    growthTime: 8000,
                    cost: 5,
                    reward: 20,
                    color: '#ff8c42',
                    tag: 'fast',
                    tagText: '快速',
                    tagClass: 'tag-fast'
                },
                tomato: {
                    id: 'tomato',
                    name: '番茄',
                    emoji: '🍅',
                    growthTime: 12000,
                    cost: 8,
                    reward: 30,
                    color: '#e05555',
                    tag: 'high',
                    tagText: '高收益',
                    tagClass: 'tag-high'
                },
                cabbage: {
                    id: 'cabbage',
                    name: '白菜',
                    emoji: '🥬',
                    growthTime: 6000,
                    cost: 3,
                    reward: 15,
                    color: '#7ec850',
                    tag: 'fast',
                    tagText: '超快',
                    tagClass: 'tag-fast'
                },
                sunflower: {
                    id: 'sunflower',
                    name: '向日葵',
                    emoji: '🌻',
                    growthTime: 15000,
                    cost: 10,
                    reward: 35,
                    color: '#ffc107',
                    tag: 'bonus',
                    tagText: '珍贵',
                    tagClass: 'tag-bonus'
                }
            };

            const TOTAL_PLOTS = 12; // 3行×4列
            const WATER_COOLDOWN = 3000; // 浇水冷却3秒
            const FERTILIZE_COOLDOWN = 5000; // 施肥冷却5秒
            const FERTILIZE_COST = 10; // 施肥花费
            const WATER_BOOST = 0.2; // 浇水加速20%
            const FERTILIZE_BOOST = 0.4; // 施肥加速40%

            // ==================== 游戏状态 ====================
            let gold = 50;
            let harvestCount = 0;
            let selectedSeedType = null; // 当前选中的种子类型ID
            let fertilizeMode = false; // 是否处于施肥模式
            let waterCooldownUntil = 0; // 浇水冷却结束时间戳
            let fertilizeCooldownUntil = 0; // 施肥冷却结束时间戳

            // 每块地的状态
            let plots = [];
            for (let i = 0; i < TOTAL_PLOTS; i++) {
                plots.push({
                    status: 'empty', // 'empty' | 'planted' | 'mature'
                    seedType: null,
                    plantTime: null, // 种植时间戳
                    growthDuration: null, // 总成长时长ms
                    watered: false,
                    fertilized: false,
                });
            }

            // ==================== DOM引用 ====================
            const goldDisplay = document.getElementById('goldDisplay');
            const harvestCountDisplay = document.getElementById('harvestCount');
            const goldBadge = document.getElementById('goldBadge');
            const harvestBadge = document.getElementById('harvestBadge');
            const seedPanel = document.getElementById('seedPanel');
            const farmGrid = document.getElementById('farmGrid');
            const waterBtn = document.getElementById('waterBtn');
            const fertilizeBtn = document.getElementById('fertilizeBtn');
            const waterCdBadge = document.getElementById('waterCdBadge');
            const fertCdBadge = document.getElementById('fertCdBadge');
            const hintText = document.getElementById('hintText');

            // ==================== 初始化UI ====================
            function buildSeedPanel() {
                seedPanel.innerHTML = '<div class="seed-panel-title">🌱 选择种子</div>';
                for (const [key, seed] of Object.entries(SEED_TYPES)) {
                    const card = document.createElement('div');
                    card.className = 'seed-card';
                    card.dataset.seedType = key;
                    card.innerHTML = `
                        <span class="seed-emoji">${seed.emoji}</span>
                        <div class="seed-info">
                            <span class="seed-name">${seed.name}</span>
                            <span class="seed-meta">
                                <span class="seed-cost">🪙${seed.cost}</span>
                                <span class="seed-time">⏱${seed.growthTime / 1000}秒</span>
                            </span>
                        </div>
                        <span class="seed-tag ${seed.tagClass}">${seed.tagText}</span>
                    `;
                    card.addEventListener('click', () => selectSeed(key, card));
                    seedPanel.appendChild(card);
                }
            }

            function buildFarmGrid() {
                farmGrid.innerHTML = '';
                for (let i = 0; i < TOTAL_PLOTS; i++) {
                    const plotEl = document.createElement('div');
                    plotEl.className = 'plot empty-plot';
                    plotEl.dataset.plotIndex = i;
                    plotEl.innerHTML = '<div class="plot-content"></div>';
                    plotEl.addEventListener('click', (e) => handlePlotClick(i, plotEl, e));
                    farmGrid.appendChild(plotEl);
                }
            }

            // ==================== 种子选择 ====================
            function selectSeed(seedType, cardEl) {
                // 取消施肥模式
                if (fertilizeMode) {
                    toggleFertilizeMode(false);
                }
                if (selectedSeedType === seedType) {
                    // 取消选择
                    selectedSeedType = null;
                    updateSeedCardStyles();
                    updatePlotStyles();
                    setHint('👆 已取消选择，点击种子卡片重新选择');
                } else {
                    selectedSeedType = seedType;
                    updateSeedCardStyles();
                    updatePlotStyles();
                    const seed = SEED_TYPES[seedType];
                    setHint(`✅ 已选择「${seed.name}」(🪙${seed.cost})，点击空地种植吧！`);
                }
            }

            function updateSeedCardStyles() {
                const cards = seedPanel.querySelectorAll('.seed-card');
                cards.forEach(card => {
                    if (card.dataset.seedType === selectedSeedType) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                });
            }

            function updatePlotStyles() {
                const plotEls = farmGrid.querySelectorAll('.plot');
                plotEls.forEach(el => {
                    const idx = parseInt(el.dataset.plotIndex);
                    if (plots[idx].status === 'empty') {
                        if (selectedSeedType) {
                            el.classList.add('has-seed-selected');
                        } else {
                            el.classList.remove('has-seed-selected');
                        }
                    }
                });
            }

            // ==================== 地块点击处理 ====================
            function handlePlotClick(plotIndex, plotEl, event) {
                const plot = plots[plotIndex];

                if (plot.status === 'empty') {
                    // 空地：种植
                    if (!selectedSeedType) {
                        flashHint('⚠️ 请先在左侧选择一种种子！');
                        shakeElement(seedPanel);
                        return;
                    }
                    const seed = SEED_TYPES[selectedSeedType];
                    if (gold < seed.cost) {
                        flashHint('😢 金币不足，无法购买该种子！');
                        shakeElement(goldBadge);
                        return;
                    }
                    // 种植
                    gold -= seed.cost;
                    plot.status = 'planted';
                    plot.seedType = selectedSeedType;
                    plot.plantTime = Date.now();
                    plot.growthDuration = seed.growthTime;
                    plot.watered = false;
                    plot.fertilized = false;
                    updateGoldDisplay();
                    renderPlot(plotIndex, plotEl);
                    updatePlotStyles();
                    // 种植动画
                    plotEl.style.transform = 'scale(0.75)';
                    setTimeout(() => { plotEl.style.transform = ''; }, 60);
                    setTimeout(() => { plotEl.style.transform = 'scale(1.04)'; }, 100);
                    setTimeout(() => { plotEl.style.transform = ''; }, 250);
                    setHint(`🌱 种下了「${seed.name}」！等待${seed.growthTime / 1000}秒成熟~`);
                    // 自动取消选择（可选）
                    // selectedSeedType = null;
                    // updateSeedCardStyles();
                } else if (plot.status === 'planted') {
                    // 生长中
                    if (fertilizeMode) {
                        // 施肥模式
                        handleFertilize(plotIndex, plot, plotEl);
                    } else {
                        // 默认浇水
                        handleWater(plotIndex, plot, plotEl);
                    }
                } else if (plot.status === 'mature') {
                    // 成熟：收获
                    if (fertilizeMode) {
                        // 施肥模式下点击成熟植物，优先收获
                        toggleFertilizeMode(false);
                    }
                    handleHarvest(plotIndex, plot, plotEl);
                }
            }

            function handleWater(plotIndex, plot, plotEl) {
                if (plot.watered) {
                    flashHint('💧 这株植物已经浇过水了~');
                    return;
                }
                const now = Date.now();
                if (now < waterCooldownUntil) {
                    const remaining = Math.ceil((waterCooldownUntil - now) / 1000);
                    flashHint(`⏳ 浇水冷却中，还需等待${remaining}秒`);
                    return;
                }
                // 执行浇水
                plot.watered = true;
                const boostMs = plot.growthDuration * WATER_BOOST;
                plot.plantTime -= boostMs; // 加速：将种植时间往前移
                waterCooldownUntil = now + WATER_COOLDOWN;
                renderPlot(plotIndex, plotEl);
                showFloatingText(plotEl, '💧+20%', 'water-text');
                setHint('💧 浇水成功！成长加速20%');
                updateWaterCooldownUI();
            }

            function handleFertilize(plotIndex, plot, plotEl) {
                if (plot.fertilized) {
                    flashHint('🧪 这株植物已经施过肥了~');
                    toggleFertilizeMode(false);
                    return;
                }
                const now = Date.now();
                if (now < fertilizeCooldownUntil) {
                    const remaining = Math.ceil((fertilizeCooldownUntil - now) / 1000);
                    flashHint(`⏳ 施肥冷却中，还需等待${remaining}秒`);
                    toggleFertilizeMode(false);
                    return;
                }
                if (gold < FERTILIZE_COST) {
                    flashHint('😢 金币不足，无法施肥！');
                    toggleFertilizeMode(false);
                    shakeElement(goldBadge);
                    return;
                }
                // 执行施肥
                gold -= FERTILIZE_COST;
                plot.fertilized = true;
                const boostMs = plot.growthDuration * FERTILIZE_BOOST;
                plot.plantTime -= boostMs;
                fertilizeCooldownUntil = now + FERTILIZE_COOLDOWN;
                updateGoldDisplay();
                renderPlot(plotIndex, plotEl);
                showFloatingText(plotEl, '🧪+40%', 'fert-text');
                setHint('🧪 施肥成功！成长加速40%');
                toggleFertilizeMode(false);
                updateFertilizeCooldownUI();
            }

            function handleHarvest(plotIndex, plot, plotEl) {
                const seed = SEED_TYPES[plot.seedType];
                gold += seed.reward;
                harvestCount++;
                updateGoldDisplay();
                updateHarvestCountDisplay();
                showFloatingText(plotEl, `+${seed.reward}🪙`, 'gold-text');
                // 重置地块
                plot.status = 'empty';
                plot.seedType = null;
                plot.plantTime = null;
                plot.growthDuration = null;
                plot.watered = false;
                plot.fertilized = false;
                plotEl.classList.remove('planted-plot', 'mature-plot');
                plotEl.classList.add('empty-plot');
                plotEl.querySelector('.plot-content').innerHTML = '';
                updatePlotStyles();
                // 收获动画
                plotEl.style.transform = 'scale(1.15)';
                setTimeout(() => { plotEl.style.transform = ''; }, 200);
                setHint(`🎉 收获了「${seed.name}」！获得${seed.reward}金币~ 总计收获${harvestCount}次`);
                // 金币徽章动画
                goldBadge.querySelector('.badge-value').classList.add('pulse');
                setTimeout(() => goldBadge.querySelector('.badge-value').classList.remove('pulse'), 400);
                harvestBadge.querySelector('.badge-value').classList.add('pulse');
                setTimeout(() => harvestBadge.querySelector('.badge-value').classList.remove('pulse'), 400);
            }

            // ==================== 施肥模式切换 ====================
            function toggleFertilizeMode(forceState) {
                const newState = (forceState !== undefined) ? forceState : !fertilizeMode;
                fertilizeMode = newState;
                if (fertilizeMode) {
                    fertilizeBtn.classList.add('active-mode');
                    fertilizeBtn.textContent = '🧪 施肥模式中... (点击植物)';
                    setHint('🧪 施肥模式已激活，点击生长中的植物进行施肥（花费10🪙加速40%）');
                    // 取消种子选择
                    if (selectedSeedType) {
                        selectedSeedType = null;
                        updateSeedCardStyles();
                        updatePlotStyles();
                    }
                } else {
                    fertilizeBtn.classList.remove('active-mode');
                    fertilizeBtn.innerHTML = '🧪 施肥 (10🪙)<span class="cooldown-badge" id="fertCdBadge" style="display:none;"></span>';
                    // 重新绑定fertCdBadge引用
                    const newBadge = fertilizeBtn.querySelector('.cooldown-badge');
                    if (newBadge) newBadge.id = 'fertCdBadge';
                    if (fertCdBadge && fertCdBadge !== newBadge) {
                        // 更新全局引用
                        window._fertCdBadgeRef = newBadge;
                    }
                    if (!forceState && fertilizeMode === false && selectedSeedType === null) {
                        setHint('👆 选择种子，然后点击空地开始种植吧！');
                    }
                }
                // 更新施肥按钮冷却徽章引用
                updateFertBadgeRef();
            }

            function updateFertBadgeRef() {
                const badge = fertilizeBtn.querySelector('#fertCdBadge');
                if (badge && badge !== window._fertCdBadgeRef) {
                    window._fertCdBadgeRef = badge;
                }
            }

            fertilizeBtn.addEventListener('click', () => {
                const now = Date.now();
                if (now < fertilizeCooldownUntil) {
                    const remaining = Math.ceil((fertilizeCooldownUntil - now) / 1000);
                    flashHint(`⏳ 施肥冷却中，还需等待${remaining}秒`);
                    return;
                }
                if (gold < FERTILIZE_COST && !fertilizeMode) {
                    flashHint('😢 金币不足，无法使用施肥功能！');
                    shakeElement(goldBadge);
                    return;
                }
                toggleFertilizeMode();
            });

            // ==================== 渲染 ====================
            function renderPlot(plotIndex, plotEl) {
                const plot = plots[plotIndex];
                const contentEl = plotEl.querySelector('.plot-content');
                plotEl.classList.remove('empty-plot', 'planted-plot', 'mature-plot', 'has-seed-selected');

                if (plot.status === 'empty') {
                    plotEl.classList.add('empty-plot');
                    contentEl.innerHTML = '';
                    if (selectedSeedType) {
                        plotEl.classList.add('has-seed-selected');
                    }
                } else if (plot.status === 'planted') {
                    plotEl.classList.add('planted-plot');
                    const seed = SEED_TYPES[plot.seedType];
                    const now = Date.now();
                    const elapsed = now - plot.plantTime;
                    const progress = Math.min(elapsed / plot.growthDuration, 0.999);
                    const progressPercent = Math.round(progress * 100);

                    // 阶段emoji
                    let stageEmoji;
                    if (progress < 0.25) {
                        stageEmoji = '🟫'; // 种子阶段
                    } else if (progress < 0.55) {
                        stageEmoji = '🌱'; // 发芽
                    } else if (progress < 0.85) {
                        stageEmoji = '🌿'; // 成长
                    } else {
                        stageEmoji = '🌳'; // 接近成熟
                    }

                    let indicatorsHtml = '';
                    if (plot.watered) {
                        indicatorsHtml += '<span class="watered-indicator">💧</span>';
                    }
                    if (plot.fertilized) {
                        indicatorsHtml += '<span class="fertilized-indicator">⚡</span>';
                    }

                    contentEl.innerHTML = `
                        ${indicatorsHtml}
                        <span class="plant-emoji">${stageEmoji}</span>
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-fill" style="width:${progressPercent}%;"></div>
                        </div>
                    `;
                } else if (plot.status === 'mature') {
                    plotEl.classList.add('mature-plot');
                    const seed = SEED_TYPES[plot.seedType];
                    contentEl.innerHTML = `
                        <span class="plant-emoji">${seed.emoji}</span>
                        <div style="font-size:0.7em;color:#6b9b4f;font-weight:700;margin-top:-2px;">成熟!</div>
                    `;
                }
            }

            function renderAllPlots() {
                const plotEls = farmGrid.querySelectorAll('.plot');
                plotEls.forEach(el => {
                    const idx = parseInt(el.dataset.plotIndex);
                    renderPlot(idx, el);
                });
                updatePlotStyles();
            }

            // ==================== 游戏循环 ====================
            function gameLoop() {
                const now = Date.now();
                let needsRender = false;

                for (let i = 0; i < TOTAL_PLOTS; i++) {
                    const plot = plots[i];
                    if (plot.status === 'planted') {
                        const elapsed = now - plot.plantTime;
                        if (elapsed >= plot.growthDuration) {
                            // 成熟了！
                            plot.status = 'mature';
                            needsRender = true;
                            const plotEl = farmGrid.querySelector(`[data-plot-index="${i}"]`);
                            if (plotEl) {
                                renderPlot(i, plotEl);
                                // 成熟提示
                                const seed = SEED_TYPES[plot.seedType];
                                showFloatingText(plotEl, '🌟成熟!', 'gold-text');
                                setHint(`🌟「${seed.name}」成熟了！点击收获吧~`);
                            }
                        } else {
                            // 更新进度条
                            const plotEl = farmGrid.querySelector(`[data-plot-index="${i}"]`);
                            if (plotEl && plotEl.classList.contains('planted-plot')) {
                                const progressFill = plotEl.querySelector('.progress-bar-fill');
                                if (progressFill) {
                                    const progress = Math.min(elapsed / plot.growthDuration, 0.999);
                                    progressFill.style.width = Math.round(progress * 100) + '%';
                                }
                                // 更新阶段emoji
                                const progress = Math.min(elapsed / plot.growthDuration, 0.999);
                                let stageEmoji;
                                if (progress < 0.25) stageEmoji = '🟫';
                                else if (progress < 0.55) stageEmoji = '🌱';
                                else if (progress < 0.85) stageEmoji = '🌿';
                                else stageEmoji = '🌳';
                                const emojiEl = plotEl.querySelector('.plant-emoji');
                                if (emojiEl && emojiEl.textContent !== stageEmoji) {
                                    emojiEl.textContent = stageEmoji;
                                }
                            }
                        }
                    }
                }

                // 更新冷却UI
                updateWaterCooldownUI();
                updateFertilizeCooldownUI();

                if (needsRender) {
                    updatePlotStyles();
                }
            }

            function updateWaterCooldownUI() {
                const now = Date.now();
                const remaining = waterCooldownUntil - now;
                if (remaining > 0) {
                    waterBtn.classList.add('on-cooldown');
                    waterCdBadge.style.display = 'inline';
                    waterCdBadge.textContent = Math.ceil(remaining / 1000) + 's';
                } else {
                    waterBtn.classList.remove('on-cooldown');
                    waterCdBadge.style.display = 'none';
                    waterCdBadge.textContent = '';
                }
            }

            function updateFertilizeCooldownUI() {
                updateFertBadgeRef();
                const badge = window._fertCdBadgeRef || fertilizeBtn.querySelector('#fertCdBadge');
                const now = Date.now();
                const remaining = fertilizeCooldownUntil - now;
                if (remaining > 0 && !fertilizeMode) {
                    fertilizeBtn.classList.add('on-cooldown');
                    if (badge) {
                        badge.style.display = 'inline';
                        badge.textContent = Math.ceil(remaining / 1000) + 's';
                    }
                } else if (!fertilizeMode) {
                    fertilizeBtn.classList.remove('on-cooldown');
                    if (badge) {
                        badge.style.display = 'none';
                        badge.textContent = '';
                    }
                } else {
                    fertilizeBtn.classList.remove('on-cooldown');
                    if (badge) {
                        badge.style.display = 'none';
                        badge.textContent = '';
                    }
                }
            }

            // ==================== UI辅助函数 ====================
            function updateGoldDisplay() {
                goldDisplay.textContent = gold;
            }

            function updateHarvestCountDisplay() {
                harvestCountDisplay.textContent = harvestCount;
            }

            function setHint(msg) {
                hintText.textContent = msg;
                hintText.classList.remove('flash');
            }

            function flashHint(msg) {
                hintText.textContent = msg;
                hintText.classList.remove('flash');
                void hintText.offsetWidth;
                hintText.classList.add('flash');
            }

            function shakeElement(el) {
                el.style.animation = 'none';
                void el.offsetWidth;
                el.style.animation = 'shake 0.5s ease-out';
                setTimeout(() => { el.style.animation = ''; }, 500);
            }

            function showFloatingText(plotEl, text, className) {
                const rect = plotEl.getBoundingClientRect();
                const floatEl = document.createElement('span');
                floatEl.className = 'floating-text ' + (className || '');
                floatEl.textContent = text;
                floatEl.style.left = rect.left + rect.width / 2 - 30 + 'px';
                floatEl.style.top = rect.top + 'px';
                document.body.appendChild(floatEl);
                setTimeout(() => {
                    if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
                }, 1100);
            }

            // 添加shake动画
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
                @keyframes shake {
                    0%,100% { transform: translateX(0); }
                    15% { transform: translateX(-6px); }
                    30% { transform: translateX(6px); }
                    45% { transform: translateX(-5px); }
                    60% { transform: translateX(4px); }
                    75% { transform: translateX(-3px); }
                    90% { transform: translateX(2px); }
                }
            `;
            document.head.appendChild(shakeStyle);

            // ==================== 初始化 ====================
            function init() {
                buildSeedPanel();
                buildFarmGrid();
                updateGoldDisplay();
                updateHarvestCountDisplay();
                updatePlotStyles();
                updateWaterCooldownUI();
                updateFertilizeCooldownUI();
                setHint('👆 选择种子，然后点击空地开始种植吧！');
                // 初始化施肥徽章引用
                updateFertBadgeRef();
            }

            // ==================== 启动游戏循环 ====================
            init();
            setInterval(gameLoop, 200);

            // ==================== 点击其他地方取消施肥模式 ====================
            document.addEventListener('click', function(e) {
                if (fertilizeMode) {
                    const clickedOnFertBtn = fertilizeBtn.contains(e.target);
                    const clickedOnPlot = e.target.closest('.plot');
                    if (!clickedOnFertBtn && !clickedOnPlot) {
                        toggleFertilizeMode(false);
                    }
                }
            });

            // ==================== 浇水按钮点击 ====================
            waterBtn.addEventListener('click', () => {
                const now = Date.now();
                if (now < waterCooldownUntil) {
                    const remaining = Math.ceil((waterCooldownUntil - now) / 1000);
                    flashHint(`⏳ 浇水冷却中，还需等待${remaining}秒`);
                    return;
                }
                // 浇水按钮作为提示：引导用户点击植物
                flashHint('💧 请直接点击生长中的植物进行浇水~');
                if (fertilizeMode) {
                    toggleFertilizeMode(false);
                }
            });

            console.log('🌻 阳光菜园游戏已就绪！');
            console.log('  - 选择种子 → 点击空地种植');
