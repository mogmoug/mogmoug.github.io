<script>
  (function () {
    "use strict";

    var data = JSON.parse(document.getElementById("demo-data").textContent);
    var CATEGORIES = data.categories;
    var DEMOS = data.items;

    var listEl = document.getElementById("demo-list");
    var emptyEl = document.getElementById("demo-empty");
    var countEl = document.getElementById("demo-count");
    var searchEl = document.getElementById("demo-search");
    var filtersEl = document.getElementById("demo-filters");
    var activeCat = "all";

    var catName = {};
    CATEGORIES.forEach(function (c) {
      catName[c.id] = c.name;
    });

    var filterDefs = [{ id: "all", name: "全部" }].concat(CATEGORIES);
    filterDefs.forEach(function (f) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = f.name;
      b.setAttribute("data-cat", f.id);
      b.setAttribute("aria-pressed", f.id === "all" ? "true" : "false");
      filtersEl.appendChild(b);
    });

    filtersEl.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      activeCat = btn.getAttribute("data-cat");
      filtersEl.querySelectorAll("button[data-cat]").forEach(function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      render();
    });

    searchEl.addEventListener("input", render);

    function render() {
      var q = searchEl.value.trim().toLowerCase();
      var shown = DEMOS.filter(function (d) {
        var okCat = activeCat === "all" || d.category === activeCat;
        var hay = (d.title + " " + d.description + " " + d.file).toLowerCase();
        return okCat && (!q || hay.indexOf(q) !== -1);
      });

      listEl.innerHTML = "";
      if (!shown.length) {
        emptyEl.hidden = false;
        countEl.textContent = "0 / " + DEMOS.length;
        return;
      }
      emptyEl.hidden = true;
      countEl.textContent = shown.length + " / " + DEMOS.length;

      CATEGORIES.forEach(function (cat) {
        var items = shown.filter(function (d) {
          return d.category === cat.id;
        });
        if (!items.length) return;

        var section = document.createElement("section");
        section.className = "section demo-section";

        var head = document.createElement("div");
        head.className = "section-head";
        var h2 = document.createElement("h2");
        h2.textContent = cat.name;
        var more = document.createElement("span");
        more.className = "more";
        more.textContent = items.length + " 个 · " + cat.desc;
        head.appendChild(h2);
        head.appendChild(more);

        var grid = document.createElement("div");
        grid.className = "post-grid demo-grid";

        items.forEach(function (d) {
          var a = document.createElement("a");
          a.className = "post-card demo-card";
          a.href = encodeURI(d.file);
          a.target = "_blank";
          a.rel = "noopener";

          var meta = document.createElement("div");
          meta.className = "meta";
          var catEl = document.createElement("span");
          catEl.className = "demo-cat";
          catEl.textContent = catName[d.category] || d.categoryName;
          var size = document.createElement("span");
          size.className = "size";
          size.textContent = d.sizeKb + "K";
          meta.appendChild(catEl);
          meta.appendChild(size);

          var h3 = document.createElement("h3");
          h3.textContent = d.title;
          var p = document.createElement("p");
          p.textContent = d.description;
          var open = document.createElement("span");
          open.className = "open";
          open.textContent = "打开 Demo ↗";

          a.appendChild(meta);
          a.appendChild(h3);
          a.appendChild(p);
          a.appendChild(open);
          grid.appendChild(a);
        });

        section.appendChild(head);
        section.appendChild(grid);
        listEl.appendChild(section);
      });
    }

    render();
  })();
