<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 网页版复刻</title>
    <style>
        /* CSS 变量定义 */
        :root {
            --bg-sidebar: #f9f9f9;
            --bg-main: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #e5e5e5;
            --accent-color: #4d6bfe;
            --accent-hover: #3a56e4;
            --hover-bg: #ececec;
            --btn-bg: #ffffff;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: var(--font-family);
            color: var(--text-primary);
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- 侧边栏样式 --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: width 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 18px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            fill: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 4px;
            transition: background-color 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 20px 20px;
            padding: 12px 16px;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background-color: #f3f3f3;
            border-color: #d1d1d1;
        }

        .new-chat-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background-color: #d1d1d1;
            border-radius: 4px;
        }

        .history-label {
            font-size: 12px;
            color: var(--text-muted);
            padding: 10px 10px 6px;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 2px;
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: var(--hover-bg);
        }

        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-item.disabled {
            color: var(--text-muted);
            cursor: default;
        }

        .history-item.disabled:hover {
            background-color: transparent;
        }

        .history-item .item-action {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .history-item:hover .item-action {
            display: block;
        }

        .user-profile {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .avatar {
            width: 28px;
            height: 28px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* --- 主内容区域样式 --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--bg-main);
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 10vh; /* 视觉上偏上一点 */
        }

        .welcome-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .welcome-logo svg {
            width: 36px;
            height: 36px;
            fill: var(--accent-color);
        }

        .welcome-area h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* --- 输入框样式 --- */
        .input-wrapper {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #c0c0c0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .input-wrapper textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-family);
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-primary);
            background: transparent;
            min-height: 48px;
            max-height: 200px;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .input-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .toolbar-left {
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #f0f4ff; /* 浅蓝色背景 */
            color: var(--accent-color);
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .tool-btn:hover {
            background-color: #e0e8ff;
        }

        .tool-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-right .icon-btn {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .send-btn.disabled {
            background-color: #e0e0e0;
            color: #a0a0a0;
            cursor: not-allowed;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 10;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <!-- DeepSeek Logo SVG -->
                    <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                        <!-- 这是一个占位Logo，实际使用时可以替换为真实的DeepSeek鲸鱼Logo路径 -->
                    </svg>
                    <span>deepseek</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="搜索">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </button>
                    <button class="icon-btn" title="收起侧边栏">
                        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                </div>
            </div>

            <button class="new-chat-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                开启新对话
            </button>

            <div class="chat-history">
                <div class="history-label">今天</div>
                <ul class="history-list">
                    <li class="history-item"><span>Nature封面复刻网页</span><button class="item-action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></li>
                    <li class="history-item"><span>3D五菱宏光模型</span></li>
                    <li class="history-item"><span>Rust 介绍 PPT</span></li>
                    <li class="history-item"><span>Manim介绍</span></li>
                    <li class="history-item"><span>Transformer 3D演示</span></li>
                    <li class="history-item"><span>单页AI Agent记忆功能</span></li>
                    <li class="history-item"><span>Agent不写文件能做什么</span></li>
                    <li class="history-item"><span>终端图书馆管理系统</span></li>
                    <li class="history-item disabled"><span>旧版推推模拟网页</span></li>
                </ul>
            </div>

            <div class="user-profile">
                <div class="user-info">
                    <div class="avatar">Q</div>
                    <span>170****43@qq.com</span>
                </div>
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="chat-container">
                <div class="welcome-area">
                    <div class="welcome-logo">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                        </svg>
                    </div>
                    <h1>你好，有什么我能帮你的吗？</h1>
                </div>

                <div class="input-wrapper">
                    <textarea id="chat-input" placeholder="给 DeepSeek 发送消息" rows="1"></textarea>
                    
                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <button class="tool-btn">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg> <!-- 占位图标 -->
                                深度思考
                            </button>
                            <button class="tool-btn">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> <!-- 占位图标 -->
                                智能搜索
                            </button>
                        </div>
                        <div class="toolbar-right">
                            <button class="icon-btn" title="附件">
                                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                            </button>
                            <button class="send-btn disabled" id="send-btn" title="发送">
                                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 基础交互逻辑
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // 监听输入框内容变化，改变发送按钮状态并自动调整高度
        chatInput.addEventListener('input', function() {
            // 自动调整高度
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';

            // 按钮状态切换
            if (this.value.trim().length > 0) {
                sendBtn.classList.remove('disabled');
            } else {
                sendBtn.classList.add('disabled');
            }
        });

        // 阻止回车换行，实现回车发送（可选）
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (this.value.trim().length > 0) {
                    // 模拟发送
                    console.log('发送消息:', this.value);
                    this.value = '';
                    this.style.height = 'auto';
                    sendBtn.classList.add('disabled');
                }
            }
        });

        // 点击发送按钮模拟发送
        sendBtn.addEventListener('click', function() {
            if (!this.classList.contains('disabled')) {
                console.log('发送消息:', chatInput.value);
                chatInput.value = '';
                chatInput.style.height = 'auto';
                this.classList.add('disabled');
            }
        });
    </script>
</body>
</html>
