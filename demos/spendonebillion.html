        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .app-container {
            width: 100%; max-width: 480px; height: 92vh;
            background: var(--bg); border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25); overflow: hidden;
        }
        .status-bar {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 10px 16px; color: #fff; flex-shrink: 0;
        }
        .balance-row { display:flex; align-items:center; justify-content:space-between; }
        .balance-amount { font-size:24px; font-weight:800; font-family:monospace; }
        .target-badge { background:var(--orange); color:#fff; font-size:10px; padding:3px 10px; border-radius:12px; font-weight:700; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,80,0,0.5)} 50%{box-shadow:0 0 0 10px rgba(255,80,0,0)} }
        .balance-sub { display:flex; gap:8px; margin-top:6px; font-size:10px; color:#aaa; }
        .balance-sub span { background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:10px; }
        .search-bar { padding:6px 12px; background:#fff; border-bottom:1px solid #eee; }
        .search-bar input { width:100%; border:none; background:#f5f5f5; padding:8px 14px; border-radius:20px; font-size:13px; outline:none; }
        .category-tabs { display:flex; gap:6px; padding:8px 12px; background:#fff; overflow-x:auto; flex-shrink:0; scrollbar-width:none; }
        .category-tabs::-webkit-scrollbar { display:none; }
        .cat-tab {
            flex-shrink:0; padding:6px 13px; border-radius:16px; font-size:11px;
            background:#f5f5f5; color:#666; font-weight:600; cursor:pointer;
            border:1.5px solid transparent; transition:0.2s; white-space:nowrap;
        }
        .cat-tab.active { background:#FFF1EB; color:var(--orange); border-color:var(--orange); }
        .product-list {
            flex:1; overflow-y:auto; padding:8px 10px;
            display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#F4F4F4;
        }
        .product-card {
            background:#fff; border-radius:12px; padding:10px 8px 8px;
            display:flex; flex-direction:column; align-items:center; gap:5px;
            box-shadow:0 1px 4px rgba(0,0,0,0.04); border:2px solid transparent;
            cursor:pointer; transition:0.15s;
        }
        .product-card:active { transform:scale(0.97); }
        .product-card .emoji { font-size:36px; line-height:1; }
        .product-card .name { font-size:12px; font-weight:700; color:#222; text-align:center; min-height:30px; }
        .product-card .price { font-size:16px; font-weight:800; color:var(--red); }
        .product-card .yield-tag { font-size:10px; background:#FFF9E6; color:#C79100; padding:2px 6px; border-radius:4px; font-weight:700; }
        .btn-row { display:flex; gap:4px; width:100%; margin-top:4px; }
        .buy-btn {
            background:linear-gradient(135deg, #FF5000, #FF6D2E); color:#fff;
            border:none; padding:8px 6px; border-radius:16px; font-size:11px;
            font-weight:700; cursor:pointer; text-align:center; flex:1;
        }
        .buy-btn.cart-add { background:#fff; color:var(--orange); border:1.5px solid var(--orange); font-size:10px; flex:0.8; }
        .buy-btn:active { opacity:0.7; transform:scale(0.94); }
        .bottom-nav { display:flex; background:#fff; border-top:1px solid #eee; flex-shrink:0; padding:5px 0; }
        .nav-item {
            flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
            cursor:pointer; font-size:10px; color:#888; position:relative; padding:5px 0;
        }
        .nav-item.active { color:var(--orange); }
        .nav-item .badge {
            position:absolute; top:0; right:50%; transform:translateX(20px);
            background:var(--red); color:#fff; font-size:10px; min-width:17px;
            height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:700;
        }
        .overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:flex-end; justify-content:center;
        }
        .panel {
            background:#fff; width:100%; max-width:480px; max-height:75vh;
            border-radius:20px 20px 0 0; display:flex; flex-direction:column; animation:slideUp 0.3s;
        }
        @keyframes slideUp { from{ transform:translateY(100%); } to{ transform:translateY(0); } }
        .panel-header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #eee; }
        .panel-close { width:30px; height:30px; border-radius:50%; background:#f5f5f5; border:none; font-size:18px; cursor:pointer; }
        .panel-body { flex:1; overflow-y:auto; padding:12px 16px; }
        .panel-footer { padding:12px 16px; border-top:1px solid #eee; }
        .btn-primary { background:var(--orange); color:#fff; border:none; padding:12px 20px; border-radius:22px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
        .btn-primary:disabled { background:#ccc; }
        .toast {
            position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.85); color:#fff; padding:10px 22px; border-radius:20px;
            font-size:13px; z-index:300; pointer-events:none; opacity:0; transition:0.3s;
        }
        .toast.show { opacity:1; }
        .win-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:200;
        }
        .win-dialog {
            background:#fff; border-radius:24px; padding:30px; text-align:center;
            width:90%; max-width:350px; animation:bounceIn 0.5s;
        }
        @keyframes bounceIn { 0%{transform:scale(0.5); opacity:0;} 70%{transform:scale(1.05);} 100%{transform:scale(1); opacity:1;} }
        .win-dialog h2 { font-size:22px; margin:10px 0; }
    </style>
</head>

</div>

        { id:115, name:'私人海岛', cat:'special', emoji:'🏝️', price:100000000, yield:5.0 },
        { id:116, name:'坦克', cat:'special', emoji:'🪖', price:15000000, yield:0 },
        { id:117, name:'直升机', cat:'special', emoji:'🚁', price:20000000, yield:0 },
        { id:118, name:'金条1kg', cat:'special', emoji:'🟡', price:450000, yield:1.5 },
        { id:119, name:'恐龙蛋化石', cat:'special', emoji:'🥚', price:8000000, yield:6.0 },
        { id:120, name:'陨石', cat:'special', emoji:'☄️', price:3000000, yield:3.0 },
        { id:121, name:'欧洲城堡', cat:'special', emoji:'🏰', price:60000000, yield:3.5 },
        { id:122, name:'潜艇', cat:'special', emoji:'🤿', price:35000000, yield:0 },
    ];

    // 游戏状态
    const INIT_BALANCE = 1_000_000_000;
    let balance = INIT_BALANCE;
    let totalSpent = 0;
    let totalEarned = 0;
    let gameDays = 1;
    let gameWon = false;
    let purchased = {};
    let cart = {};
    let currentCat = 'all';
    let searchQuery = '';

    function fmtMoney(n) { return n.toLocaleString('zh-CN', {maximumFractionDigits:0}); }
    function fmtCompact(n) { if(n>=1e8) return (n/1e8).toFixed(2)+'亿'; if(n>=1e4) return (n/1e4).toFixed(1)+'万'; return n.toString(); }

    const $ = (sel) => document.querySelector(sel);
    const balanceEl = $('#balanceDisplay');
    const spentEl = $('#spentDisplay');
    const incomeEl = $('#incomeRateDisplay');
    const gameTimeEl = $('#gameTime');
    const productListEl = $('#productList');
    const catTabsEl = $('#categoryTabs');
    const searchInput = $('#searchInput');
    const cartBadge = $('#cartBadge');
    const cartOverlay = $('#cartOverlay');
    const cartBody = $('#cartBody');
    const cartTotal = $('#cartTotal');
    const cartCheckout = $('#cartCheckout');
    const assetsOverlay = $('#assetsOverlay');
    const assetsBody = $('#assetsBody');
    const winOverlay = $('#winOverlay');
    const winStats = $('#winStats');
    const toastEl = $('#toast');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    function getDailyIncome() {
        let total = 0;
        for(let [id, qty] of Object.entries(purchased)) {
            const p = products.find(x => x.id == id);
            if(p && p.yield>0) total += (p.price * qty) * (p.yield/100/365);
        }
        return total;
    }

    function updateUI() {
        balanceEl.textContent = fmtMoney(Math.max(0, Math.floor(balance)));
        spentEl.textContent = '¥' + fmtCompact(totalSpent);
        const daily = getDailyIncome();
        incomeEl.textContent = '📈 日收益: ¥' + fmtCompact(daily) + '/天';
        gameTimeEl.textContent = '第'+gameDays+'天';
        const cartCount = Object.values(cart).reduce((a,b)=>a+b,0);
        cartBadge.style.display = cartCount>0 ? 'flex' : 'none';
        cartBadge.textContent = cartCount;
    }

    function getFilteredProducts() {
        let list = products;
        if(currentCat !== 'all') list = list.filter(p => p.cat === currentCat);
        if(searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            list = list.filter(p => p.name.toLowerCase().includes(q) || p.cat.includes(q) || fmtCompact(p.price).includes(q));
        }
        return list;
    }

    function renderCategories() {
        const cats = ['all','daily','digital','luxury','property','finance','company','collectible','service','virtual','special'];
        const names = {all:'全部', daily:'日常', digital:'数码', luxury:'奢侈品', property:'房产', finance:'金融', company:'公司', collectible:'收藏', service:'服务', virtual:'虚拟', special:'奇葩'};
        catTabsEl.innerHTML = cats.map(c => `<div class="cat-tab${c===currentCat?' active':''}" data-cat="${c}">${names[c]}</div>`).join('');
    }

    function renderProducts() {
        const list = getFilteredProducts();
        if(list.length === 0) {
            productListEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:#999;">🔍 没有找到商品</div>';
            return;
        }
        productListEl.innerHTML = list.map(p => `
            <div class="product-card" data-id="${p.id}">
                <div class="emoji">${p.emoji}</div>
                <div class="name">${p.name}</div>
                <div class="price">¥${fmtCompact(p.price)}</div>
                ${p.yield>0 ? `<span class="yield-tag">📈 ${p.yield}%</span>` : ''}
                <div class="btn-row">
                    <button class="buy-btn" data-action="buy" data-id="${p.id}">购买</button>
                    <button class="buy-btn cart-add" data-action="cart" data-id="${p.id}">+车</button>
                </div>
            </div>
        `).join('');
    }

    function buyProduct(id, qty=1) {
        if(gameWon) return false;
        const p = products.find(x => x.id == id);
        if(!p) return false;
        const cost = p.price * qty;
        if(cost > balance) {
            showToast('⚠️ 余额不足');
            return false;
        }
        balance -= cost;
        totalSpent += cost;
        purchased[id] = (purchased[id]||0) + qty;
        if(cart[id]) delete cart[id];
        showToast('✅ 购买 '+p.name);
        updateUI();
        checkWin();
        return true;
    }

    function addToCart(id, qty=1) {
        if(gameWon) return;
        cart[id] = (cart[id]||0) + qty;
        showToast('🛒 已加入购物车');
        updateUI();
        renderCart();
    }

    function checkoutCart() {
        const items = Object.entries(cart).filter(([_,q])=>q>0);
        if(items.length===0) return;
        let total = 0;
        items.forEach(([id,q]) => {
            const p = products.find(x=>x.id==id);
            if(p) total += p.price*q;
        });
        if(total > balance) {
            showToast('余额不足，总计¥'+fmtCompact(total));
            return;
        }
        items.forEach(([id,q]) => buyProduct(parseInt(id), q));
        cart = {};
        updateUI();
        renderCart();
    }

    function sellAsset(id) {
        if(!purchased[id] || purchased[id]<=0) return;
        const p = products.find(x=>x.id==id);
        if(!p) return;
        const sellPrice = Math.floor(p.price * 0.7);
        purchased[id]--;
        if(purchased[id]<=0) delete purchased[id];
        balance += sellPrice;
        totalSpent -= p.price;
        if(totalSpent<0) totalSpent=0;
        showToast('💸 卖出 '+p.name);
        updateUI();
        renderAssets();
    }

    // ========== 胜利条件修复 ==========
    function checkWin() {
        if(gameWon) return;
        // 只要余额向下取整后 ≤ 0，立即获胜
        if(Math.floor(balance) <= 0) {
            gameWon = true;
            balance = 0;
            updateUI();
            winStats.innerHTML = `
                <p>💰 初始资金：10亿</p>
                <p>💸 总花费：¥${fmtMoney(totalSpent)}</p>
                <p>📈 累计收益：¥${fmtMoney(Math.floor(totalEarned))}</p>
                <p>⏱ 天数：${gameDays}天</p>
                <p style="color:var(--orange);font-weight:bold;">🏆 恭喜！成功花光10亿！</p>
            `;
            winOverlay.style.display = 'flex';
        }
    }

    function renderCart() {
        const items = Object.entries(cart).filter(([_,q])=>q>0);
        if(items.length===0) {
            cartBody.innerHTML = '<p style="text-align:center;color:#999;padding:30px;">购物车空空如也</p>';
            cartTotal.textContent = '¥0';
            cartCheckout.disabled = true;
            return;
        }
        let total = 0;
        cartBody.innerHTML = items.map(([id,q]) => {
            const p = products.find(x=>x.id==id);
            if(!p) return '';
            const sub = p.price * q;
            total += sub;
            return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;">
                <span style="font-size:24px;">${p.emoji}</span>
                <div style="flex:1;"><b>${p.name}</b><br><span style="color:var(--red);">¥${fmtCompact(p.price)} × ${q}</span></div>
                <div style="display:flex;gap:4px;align-items:center;">
                    <button data-cart-dec="${id}" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:#fff;">−</button>
                    <span>${q}</span>
                    <button data-cart-inc="${id}" style="width:24px;height:24px;border-radius:50%;border:1px solid #ccc;background:#fff;">+</button>
                </div>
                <b style="min-width:55px;text-align:right;">¥${fmtCompact(sub)}</b>
            </div>`;
        }).join('');
        cartTotal.textContent = '¥'+fmtCompact(total);
        cartCheckout.disabled = total > balance || total <= 0;
    }

    function renderAssets() {
        const entries = Object.entries(purchased).filter(([_,q])=>q>0);
        if(entries.length===0) {
            assetsBody.innerHTML = '<p style="text-align:center;color:#999;padding:30px;">暂无资产</p>';
            return;
        }
        assetsBody.innerHTML = entries.map(([id,q]) => {
            const p = products.find(x=>x.id==id);
            if(!p) return '';
            const val = p.price * q;
            const daily = p.yield>0 ? (val * p.yield/100/365) : 0;
            return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;">
                <span style="font-size:28px;">${p.emoji}</span>
                <div style="flex:1;"><b>${p.name}</b> ×${q}<br><span style="font-size:10px;color:var(--gold);">${p.yield>0 ? '📈 日收益约¥'+fmtCompact(daily) : '不产生收益'}</span></div>
                <div style="text-align:right;"><b>¥${fmtCompact(val)}</b></div>
                <button data-sell="${id}" style="margin-left:6px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:4px 10px;font-size:10px;">卖出</button>
            </div>`;
        }).join('');
    }

    // 事件委托
    productListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if(!btn) return;
        const id = parseInt(btn.dataset.id);
        const action = btn.dataset.action;
        if(action === 'buy') buyProduct(id, 1);
        else if(action === 'cart') addToCart(id, 1);
    });

    cartBody.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if(!btn) return;
        const id = parseInt(btn.dataset.cartInc || btn.dataset.cartDec);
        if(btn.dataset.cartInc) addToCart(id, 1);
        if(btn.dataset.cartDec) {
            if(cart[id] && cart[id] > 0) {
                cart[id]--;
                if(cart[id] <= 0) delete cart[id];
                updateUI();
                renderCart();
            }
        }
    });

    assetsBody.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-sell]');
        if(btn) sellAsset(parseInt(btn.dataset.sell));
    });

    catTabsEl.addEventListener('click', (e) => {
        const tab = e.target.closest('.cat-tab');
        if(!tab) return;
        currentCat = tab.dataset.cat;
        renderCategories();
        renderProducts();
    });

    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        renderProducts();
    });

    // 底部导航
    $('#navShop').addEventListener('click', ()=>{
        cartOverlay.style.display='none'; assetsOverlay.style.display='none';
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        $('#navShop').classList.add('active');
    });
    $('#navCart').addEventListener('click', ()=>{
        assetsOverlay.style.display='none'; renderCart();
        cartOverlay.style.display='flex';
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        $('#navCart').classList.add('active');
    });
    $('#navAssets').addEventListener('click', ()=>{
        cartOverlay.style.display='none'; renderAssets();
        assetsOverlay.style.display='flex';
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        $('#navAssets').classList.add('active');
    });
    $('#cartClose').addEventListener('click', ()=> cartOverlay.style.display='none');
    $('#assetsClose').addEventListener('click', ()=> assetsOverlay.style.display='none');
    cartCheckout.addEventListener('click', ()=>{ checkoutCart(); renderCart(); });

    $('#restartBtn').addEventListener('click', ()=>{
        balance = INIT_BALANCE; totalSpent = 0; totalEarned = 0;
        gameDays = 1; gameWon = false;
        purchased = {}; cart = {};
        currentCat = 'all'; searchQuery = '';
        searchInput.value = '';
        winOverlay.style.display = 'none';
        cartOverlay.style.display = 'none';
        assetsOverlay.style.display = 'none';
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        $('#navShop').classList.add('active');
        renderCategories(); renderProducts(); updateUI();
        showToast('🔄 新游戏！目标：花光10亿');
    });

    // 游戏循环：1秒=1天，修复胜利触发
    setInterval(() => {
        if(gameWon) return;
        const income = getDailyIncome();
        if(income > 0) {
            balance += income;
            totalEarned += income;
        }
        gameDays++;
        updateUI();
        checkWin(); // 每日收益后也要检查胜利
    }, 1000);

    // 初始化
    renderCategories();
    renderProducts();
    updateUI();
    console.log('🛍️ 游戏就绪（胜利条件已修复：余额≤0即获胜）');
})();
</script>
</body>
</html>
