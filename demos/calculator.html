<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简易计算器</title>
    <style>
      :root {
        --bg: #f5fbf7;
        --panel: #ffffff;
        --text: #10201a;
        --muted: #5c7067;
        --border: #dbe8e0;
        --btn: #f2f8f4;
        --btn-hover: #e7f2eb;
        --accent: #16a34a;
        --accent-2: #0284c7;
        --gradient: linear-gradient(115deg, #22c55e, #38bdf8);
        --shadow: 0 24px 60px -28px rgba(16, 60, 40, 0.4);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #080f0c;
          --panel: #101c17;
          --text: #e6f4ec;
          --muted: #94aa9f;
          --border: #22332b;
          --btn: #16241e;
          --btn-hover: #1d2e26;
          --accent: #7ee787;
          --accent-2: #79c0ff;
          --shadow: 0 28px 60px -26px rgba(0, 0, 0, 0.85);
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            40rem 26rem at 12% 0%,
            rgba(34, 197, 94, 0.16),
            transparent 65%
          ),
          radial-gradient(
            36rem 24rem at 100% 100%,
            rgba(56, 189, 248, 0.18),
            transparent 65%
          ),
          var(--bg);
      }
      .calculator {
        width: min(100%, 360px);
        padding: 1.1rem;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }
      .display {
        min-height: 5.2rem;
        padding: 1rem 1.1rem 0.7rem;
        text-align: right;
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.2;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .display::-webkit-scrollbar {
        display: none;
      }
      .history {
        padding: 0 1.1rem 0.7rem;
        text-align: right;
        font-size: 0.82rem;
        color: var(--muted);
        min-height: 1.4rem;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.55rem;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 15px;
        background: var(--btn);
        color: var(--text);
        font: inherit;
        font-size: 1.12rem;
        font-weight: 600;
        padding: 0.9rem 0;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease,
          border-color 0.12s ease;
        user-select: none;
      }
      button:hover {
        background: var(--btn-hover);
        border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
      .op {
        color: var(--accent-2);
      }
      .func {
        color: var(--muted);
        font-size: 1rem;
      }
      .equals {
        background: var(--gradient);
        border: 0;
        color: #06110c;
        font-weight: 800;
        grid-row: span 2;
      }
      .equals:hover {
        filter: brightness(1.05);
      }
      .zero {
        grid-column: span 2;
      }
      .hint {
        margin: 0.9rem 0 0;
        text-align: center;
        font-size: 0.72rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="简易计算器">
      <div class="history" id="history"></div>
      <div class="display" id="display" role="textbox" aria-readonly="true" tabindex="0">0</div>
      <div class="buttons">
        <button class="func" data-action="clear" aria-label="清空">C</button>
        <button class="func" data-action="del" aria-label="删除">⌫</button>
        <button class="op" data-action="percent" aria-label="百分号">%</button>
        <button class="op" data-op="÷" aria-label="除以">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="op" data-op="×" aria-label="乘以">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="op" data-op="-" aria-label="减去">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="op" data-op="+" aria-label="加上">+</button>

        <button class="zero" data-digit="0">0</button>
        <button data-digit=".">.</button>
        <button class="equals" data-action="equals" aria-label="等于">=</button>
      </div>
      <p class="hint">支持键盘输入 · Esc 清空</p>
    </main>

    <script>
      var display = document.getElementById("display");
      var history = document.getElementById("history");
      var current = "0";
      var previous = null;
      var operator = null;
      var resetNext = false;
      var error = false;

      function render() {
        display.textContent = current;
        history.textContent =
          previous !== null && operator ? previous + " " + operator : "";
      }

      function inputDigit(d) {
        if (error) clearAll();
        if (resetNext) {
          current = d === "." ? "0." : d;
          resetNext = false;
        } else if (d === ".") {
          if (current.indexOf(".") === -1) current += ".";
        } else if (current === "0") {
          current = d;
        } else {
          current += d;
        }
        render();
      }

      function clearAll() {
        current = "0";
        previous = null;
        operator = null;
        resetNext = false;
        error = false;
        render();
      }

      function del() {
        if (error) return clearAll();
        if (resetNext) {
          current = "0";
          resetNext = false;
        } else {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          if (current === "-") current = "0";
        }
        render();
      }

      function percent() {
        if (error) return;
        var n = parseFloat(current);
        if (isFinite(n)) current = String(n / 100);
        render();
      }

      function compute(a, b, op) {
        switch (op) {
          case "+":
            return a + b;
          case "-":
            return a - b;
          case "×":
            return a * b;
          case "÷":
            return b === 0 ? NaN : a / b;
        }
        return b;
      }

      function chooseOp(op) {
        if (error) return clearAll();
        var n = parseFloat(current);
        if (previous !== null && operator && !resetNext) {
          var r = compute(previous, n, operator);
          if (!isFinite(r)) return fail();
          current = String(round(r));
          previous = r;
        } else {
          previous = n;
        }
        operator = op;
        resetNext = true;
        render();
      }

      function equals() {
        if (error) return clearAll();
        if (previous === null || !operator) return;
        var n = parseFloat(current);
        var r = compute(previous, n, operator);
        if (!isFinite(r)) return fail();
        history.textContent = previous + " " + operator + " " + current + " =";
        current = String(round(r));
        previous = null;
        operator = null;
        resetNext = true;
        render();
      }

      function round(n) {
        return Math.round(n * 1e10) / 1e10;
      }

      function fail() {
        current = "错误";
        previous = null;
        operator = null;
        resetNext = true;
        error = true;
        render();
      }

      document.querySelector(".buttons").addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        if (btn.dataset.digit) inputDigit(btn.dataset.digit);
        else if (btn.dataset.op) chooseOp(btn.dataset.op);
        else if (btn.dataset.action === "clear") clearAll();
        else if (btn.dataset.action === "del") del();
        else if (btn.dataset.action === "percent") percent();
        else if (btn.dataset.action === "equals") equals();
      });

      document.addEventListener("keydown", function (e) {
        var k = e.key;
        if (/^[0-9.]$/.test(k)) {
          e.preventDefault();
          inputDigit(k);
        } else if (k === "+" || k === "-") {
          e.preventDefault();
          chooseOp(k);
        } else if (k === "*") {
          e.preventDefault();
          chooseOp("×");
        } else if (k === "/") {
          e.preventDefault();
          chooseOp("÷");
        } else if (k === "%") {
          e.preventDefault();
          percent();
        } else if (k === "Enter" || k === "=") {
          e.preventDefault();
          equals();
        } else if (k === "Backspace") {
          e.preventDefault();
          del();
        } else if (k === "Escape") {
          e.preventDefault();
          clearAll();
        }
      });

      render();
    </script>
  </body>
</html>
