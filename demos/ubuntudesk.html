<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu 桌面</title>
<style>
/* ===================== 基础 ===================== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ubuntu-orange:#e95420;
  --ubuntu-purple:#77216f;
  --panel:rgba(0,0,0,.72);
  --wallpaper:
    radial-gradient(circle at 15% 25%, rgba(233,84,32,.30), transparent 42%),
    radial-gradient(circle at 82% 72%, rgba(119,33,111,.65), transparent 48%),
    radial-gradient(circle at 55% 110%, rgba(233,84,32,.18), transparent 50%),
    linear-gradient(155deg,#150818 0%,#2c001e 38%,#4a1240 68%,#1a0a20 100%);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Ubuntu','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:#1a0a20;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input{font-family:inherit}

/* ===================== 桌面 ===================== */
#desktop{position:fixed;inset:0;overflow:hidden}

#wallpaper{
  position:absolute;inset:0;
  background:var(--wallpaper);
  transition:filter .35s ease;
}

body.overview #wallpaper{filter:blur(10px) brightness(.55) saturate(1.2)}
body.overview #desktopIcons{opacity:0;pointer-events:none}
body.overview #dock{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(-20px)}

/* ===================== 顶栏 ===================== */
#topbar{
  position:fixed;top:0;left:0;right:0;height:30px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;font-size:13px;z-index:7000;
  box-shadow:0 1px 0 rgba(255,255,255,.05);
}
#topbar .tb-left,#topbar .tb-right{display:flex;align-items:center;gap:4px;flex:1}
#topbar .tb-right{justify-content:flex-end}
#topbar .tb-center{flex:0 0 auto;display:flex;justify-content:center}

#activitiesBtn{
  background:transparent;border:0;color:#fff;font-size:13px;
  padding:3px 12px;border-radius:20px;cursor:pointer;transition:background .15s;
}
#activitiesBtn:hover{background:rgba(255,255,255,.16)}
body.overview #activitiesBtn{background:rgba(255,255,255,.24)}

#clock{
  padding:3px 12px;border-radius:20px;cursor:default;
  transition:background .15s;white-space:nowrap;letter-spacing:.2px;
}
#clock:hover{background:rgba(255,255,255,.12)}

.tray-icon{
  background:transparent;border:0;color:#fff;cursor:pointer;
  display:grid;place-items:center;width:26px;height:24px;border-radius:6px;
  transition:background .15s;
}
.tray-icon:hover{background:rgba(255,255,255,.16)}

/* 系统菜单 */
#systemMenu{
  position:fixed;top:34px;right:10px;width:290px;
  background:rgba(40,30,45,.96);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:14px;z-index:7500;color:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
#systemMenu.hidden{display:none}
.sm-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.sm-row span{width:44px;opacity:.85;flex-shrink:0}
.sm-row input[type=range]{
  flex:1;-webkit-appearance:none;height:5px;border-radius:3px;
  background:rgba(255,255,255,.22);outline:none;cursor:pointer;
}
.sm-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--ubuntu-orange);border:2px solid #fff;cursor:pointer;
}
.sm-row input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  background:var(--ubuntu-orange);border:2px solid #fff;cursor:pointer;
}
.sm-sep{height:1px;background:rgba(255,255,255,.12);margin:8px 0}
.sm-actions{display:flex;gap:8px}
.sm-actions button{
  flex:1;padding:8px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:#fff;font-size:13px;cursor:pointer;
  transition:background .15s;
}
.sm-actions button:hover{background:rgba(255,255,255,.18)}

/* ===================== Dock ===================== */
#dock{
  position:fixed;left:8px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:6px;
  padding:8px 7px;
  background:rgba(28,16,32,.55);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  z-index:6000;
  transition:opacity .25s, transform .25s;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.dock-item{
  position:relative;width:46px;height:46px;border:0;border-radius:12px;
  background:transparent;cursor:pointer;display:grid;place-items:center;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3), background .16s;
}
.dock-item:hover{background:rgba(255,255,255,.14);transform:scale(1.12)}
.dock-item:active{transform:scale(1.02)}
.dock-item svg{width:32px;height:32px;display:block;pointer-events:none}
.dock-item.running::after{
  content:'';position:absolute;left:-3px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.8);
}
.dock-sep{height:1px;background:rgba(255,255,255,.14);margin:3px 6px}

/* 提示气泡 */
.dock-item .tip{
  position:absolute;left:60px;top:50%;transform:translateY(-50%) translateX(-6px);
  background:rgba(30,20,34,.96);color:#fff;font-size:12px;padding:5px 10px;
  border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .15s, transform .15s;border:1px solid rgba(255,255,255,.12);
}
.dock-item:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}

/* ===================== 桌面图标 ===================== */
#desktopIcons{
  position:absolute;top:44px;left:16px;
  display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;
  max-height:calc(100vh - 80px);
  transition:opacity .25s;z-index:10;
}
.desk-icon{
  width:88px;padding:8px 4px;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:background .12s;text-align:center;
}
.desk-icon:hover{background:rgba(255,255,255,.13)}
.desk-icon.selected{background:rgba(233,84,32,.35);outline:1px solid rgba(255,255,255,.28)}
.desk-icon svg{width:42px;height:42px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.desk-icon span{
  color:#fff;font-size:11.5px;line-height:1.3;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
  word-break:break-all;
}

/* ===================== 窗口 ===================== */
#windowLayer{position:absolute;inset:0;pointer-events:none}

.window{
  position:absolute;
  display:flex;flex-direction:column;
  background:#fafafa;
  border-radius:10px;
  overflow:hidden;
  pointer-events:auto;
  box-shadow:0 8px 28px rgba(0,0,0,.42), 0 0 0 1px rgba(0,0,0,.30);
  min-width:320px;min-height:200px;
  will-change:transform;
}
.window.active{
  box-shadow:0 22px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.35);
}
.window.minimized{display:none}

.win-header{
  height:38px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 8px 0 12px;
  background:linear-gradient(180deg,#414141,#383838);
  color:#f0f0f0;cursor:grab;
}
.window.active .win-header{background:linear-gradient(180deg,#464646,#3a3a3a)}
.win-header:active{cursor:grabbing}
.win-title{
  flex:1;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;
}
.win-title svg{width:16px;height:16px;flex-shrink:0}
.win-title span{overflow:hidden;text-overflow:ellipsis}

.win-controls{display:flex;gap:7px;align-items:center}
.wc{
  width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.16);color:#e8e8e8;
  display:grid;place-items:center;font-size:11px;line-height:1;
  transition:background .13s,color .13s;padding:0;font-weight:700;
}
.wc:hover{background:rgba(255,255,255,.34);color:#fff}
.wc-close:hover{background:#e95420;color:#fff}
.wc-max:hover{background:#3ba55d;color:#fff}
.wc-min:hover{background:#d6a03a;color:#fff}

.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff}

.win-resizer{
  position:absolute;right:0;bottom:0;width:16px;height:16px;
  cursor:nwse-resize;z-index:5;
}

/* ===================== 终端 ===================== */
.app-terminal{
  background:#300a24;color:#eee;
  font-family:'Ubuntu Mono','Cascadia Code',Consolas,Monaco,monospace;
  font-size:13.5px;line-height:1.55;
  display:flex;flex-direction:column;height:100%;
}
.term{flex:1;overflow-y:auto;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.term::-webkit-scrollbar{width:9px}
.term::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:5px}
.term-row{margin:0}
.term-line{display:flex;align-items:baseline}
.ps1{white-space:nowrap;flex-shrink:0}
.ps-user{color:#8ae234;font-weight:700}
.ps-path{color:#729fcf;font-weight:700}
.ps-sym{color:#eeeeee}
.term-in{
  flex:1;background:transparent;border:0;outline:none;color:#fff;
  font:inherit;margin-left:7px;caret-color:#fff;
}
.ls-dir{color:#729fcf;font-weight:700}
.ls-exec{color:#8ae234}
.term-err{color:#ff6b6b}
.term-info{color:#ad7fa8}

/* ===================== 文件管理器 ===================== */
.app-files{display:flex;height:100%;background:#fff;color:#333}
.files-sidebar{
  width:170px;flex-shrink:0;background:#f4f1f4;border-right:1px solid #e0dae0;
  padding:10px 8px;overflow-y:auto;
}
.side-title{
  font-size:11px;font-weight:700;color:#8a7f8a;text-transform:uppercase;
  letter-spacing:.6px;padding:8px 10px 5px;
}
.side-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  font-size:13px;cursor:pointer;transition:background .12s;
}
.side-item:hover{background:#e6e0e6}
.side-item.active{background:#e95420;color:#fff}
.side-item svg{width:16px;height:16px;flex-shrink:0}
.files-main{flex:1;display:flex;flex-direction:column;min-width:0}
.files-toolbar{
  height:46px;flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:0 10px;border-bottom:1px solid #e6e0e6;background:#fafafa;
}
.files-toolbar button{
  width:30px;height:30px;border-radius:7px;border:0;background:transparent;
  cursor:pointer;display:grid;place-items:center;color:#555;transition:background .12s;
}
.files-toolbar button:hover{background:#eae4ea}
.files-toolbar button:disabled{opacity:.3;cursor:default;background:transparent}
.crumbs{
  flex:1;display:flex;align-items:center;gap:2px;font-size:13px;
  background:#fff;border:1px solid #e6e0e6;border-radius:8px;
  padding:4px 8px;overflow:hidden;white-space:nowrap;min-width:0;
}
.crumb{padding:2px 6px;border-radius:5px;cursor:pointer;flex-shrink:0}
.crumb:hover{background:#f0eaf0}
.crumb-sep{opacity:.4;flex-shrink:0}
.files-grid{
  flex:1;overflow-y:auto;padding:14px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:6px;align-content:start;
}
.files-grid::-webkit-scrollbar{width:10px}
.files-grid::-webkit-scrollbar-thumb{background:#ccc;border-radius:5px}
.file-item{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 4px;border-radius:8px;cursor:pointer;text-align:center;
  transition:background .12s;
}
.file-item:hover{background:#eef4fc}
.file-item.selected{background:#d6e6fb}
.file-item svg{width:44px;height:44px}
.file-item span{font-size:11.5px;line-height:1.25;word-break:break-all;color:#333}
.files-status{
  height:26px;flex-shrink:0;border-top:1px solid #e6e0e6;background:#fafafa;
  display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:#777;
}

/* ===================== 文本编辑器 ===================== */
.app-editor{display:flex;flex-direction:column;height:100%;background:#fff}
.editor-toolbar{
  height:38px;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:#f7f4f7;border-bottom:1px solid #e6e0e6;
}
.editor-toolbar button{
  border:1px solid #dcd4dc;background:#fff;border-radius:7px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;color:#444;
  transition:background .12s;
}
.editor-toolbar button:hover{background:#f0eaf0}
.editor-toolbar .filename{margin-left:auto;font-size:12px;color:#8a7f8a}
.editor-wrap{flex:1;display:flex;overflow:hidden}
.editor-lines{
  width:52px;flex-shrink:0;background:#f7f4f7;color:#a99fa9;
  font:13px/1.55 'Ubuntu Mono',Consolas,monospace;
  padding:12px 8px 12px 0;text-align:right;overflow:hidden;
  border-right:1px solid #eee6ee;white-space:pre;
}
.editor-text{
  flex:1;border:0;outline:none;resize:none;padding:12px 14px;
  font:13px/1.55 'Ubuntu Mono',Consolas,monospace;
  color:#2c2c2c;background:#fff;
}
.editor-text::-webkit-scrollbar{width:10px}
.editor-text::-webkit-scrollbar-thumb{background:#ccc;border-radius:5px}

/* ===================== 计算器 ===================== */
.app-calc{display:flex;flex-direction:column;height:100%;background:#2b2b2b;color:#fff}
.calc-display{
  padding:22px 20px 16px;text-align:right;
  background:#242424;border-bottom:1px solid #383838;flex-shrink:0;
}
.calc-expr{font-size:13px;color:#888;min-height:18px;word-break:break-all}
.calc-result{font-size:38px;font-weight:300;letter-spacing:.5px;word-break:break-all;line-height:1.15}
.calc-grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:#383838;padding:1px;
}
.calc-btn{
  border:0;background:#333;color:#fff;font-size:19px;cursor:pointer;
  transition:background .1s;font-weight:400;
}
.calc-btn:hover{background:#424242}
.calc-btn:active{background:#4d4d4d}
.calc-btn.op{background:#3a3a3a;color:#f5a623}
.calc-btn.op:hover{background:#474747}
.calc-btn.eq{background:#e95420;color:#fff}
.calc-btn.eq:hover{background:#f0642f}
.calc-btn.fn{background:#2e2e2e;color:#bbb}

/* ===================== 设置 ===================== */
.app-settings{display:flex;height:100%;background:#fafafa}
.set-side{width:190px;flex-shrink:0;background:#f0ecf0;padding:12px 8px;border-right:1px solid #e2dce2}
.set-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:13px;cursor:pointer;color:#444;transition:background .12s;
}
.set-item:hover{background:#e5dfe5}
.set-item.active{background:#e95420;color:#fff}
.set-item svg{width:17px;height:17px}
.set-main{flex:1;padding:26px 30px;overflow-y:auto}
.set-main h2{font-size:20px;font-weight:500;color:#2c2c2c;margin-bottom:6px}
.set-main .sub{font-size:13px;color:#888;margin-bottom:22px}
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid #eee6ee;font-size:13.5px;color:#333;
}
.set-row .label{font-weight:500}
.set-row .val{color:#888;font-size:13px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{
  width:76px;height:52px;border-radius:9px;cursor:pointer;
  border:2px solid transparent;transition:transform .15s,border-color .15s;
}
.swatch:hover{transform:scale(1.06)}
.swatch.active{border-color:#e95420;box-shadow:0 0 0 3px rgba(233,84,32,.22)}

/* ===================== 关于 ===================== */
.app-about{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;height:100%;background:linear-gradient(160deg,#2c001e,#4a1240 60%,#77216f);
  color:#fff;padding:30px;text-align:center;
}
.app-about .logo{
  width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f07040,#e95420 60%,#b83c12);
  display:grid;place-items:center;font-size:44px;font-weight:700;
  box-shadow:0 12px 40px rgba(233,84,32,.5);
}
.app-about h1{font-size:26px;font-weight:500;letter-spacing:.5px}
.app-about p{font-size:13.5px;opacity:.85;line-height:1.7;max-width:420px}
.app-about .ver{
  font-size:12px;padding:4px 14px;border-radius:20px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
}

/* ===================== 概览搜索 ===================== */
#overviewSearch{
  position:fixed;top:54px;left:50%;transform:translateX(-50%) translateY(-14px);
  z-index:8000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
body.overview #overviewSearch{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#overviewSearch input{
  width:420px;max-width:70vw;padding:11px 20px;border-radius:24px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(40,30,44,.9);backdrop-filter:blur(20px);
  color:#fff;font-size:14px;outline:none;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
#overviewSearch input::placeholder{color:rgba(255,255,255,.45)}
body.overview .window{cursor:pointer}

/* ===================== 锁屏 / 关机 ===================== */
#lockScreen{
  position:fixed;inset:0;z-index:9000;
  background:linear-gradient(160deg,#1a0a20,#2c001e 50%,#3d0f36);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;color:#fff;opacity:0;pointer-events:none;
  transition:opacity .45s ease;
}
#lockScreen.show{opacity:1;pointer-events:auto}
#lockScreen .lock-time{font-size:74px;font-weight:200;letter-spacing:2px}
#lockScreen .lock-date{font-size:16px;opacity:.7;letter-spacing:1px}
#lockScreen .lock-avatar{
  width:82px;height:82px;border-radius:50%;margin-top:26px;
  background:linear-gradient(140deg,#e95420,#77216f);
  display:grid;place-items:center;font-size:34px;
  box-shadow:0 10px 34px rgba(0,0,0,.5);
}
#lockScreen .lock-hint{font-size:13px;opacity:.6}
#lockScreen button{
  margin-top:6px;padding:9px 26px;border-radius:22px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
  color:#fff;font-size:13.5px;cursor:pointer;transition:background .15s;
}
#lockScreen button:hover{background:rgba(255,255,255,.22)}

.hidden{display:none !important}

/* 滚动条通用 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.35)}

@media (max-width:760px){
  #desktopIcons{display:none}
  #overviewSearch input{width:80vw}
}
</style>
</head>
<body>

<div id="desktop">
  <div id="wallpaper"></div>
  <div id="desktopIcons"></div>
  <div id="windowLayer"></div>

  <div id="overviewSearch">
    <input type="text" id="overviewInput" placeholder="输入以搜索窗口…" spellcheck="false">
  </div>

  <div id="dock"></div>

  <div id="topbar">
    <div class="tb-left">
      <button id="activitiesBtn">活动</button>
    </div>
    <div class="tb-center"><span id="clock"></span></div>
    <div class="tb-right">
      <button class="tray-icon" id="netIcon" title="网络"></button>
      <button class="tray-icon" id="volIcon" title="音量"></button>
      <button class="tray-icon" id="batIcon" title="电池"></button>
      <button class="tray-icon" id="sysMenuBtn" title="系统菜单"></button>
    </div>
  </div>

  <div id="systemMenu" class="hidden">
    <div class="sm-row">
      <span>音量</span>
      <input type="range" min="0" max="100" value="72" id="volumeSlider">
    </div>
    <div class="sm-row">
      <span>亮度</span>
      <input type="range" min="25" max="100" value="100" id="brightnessSlider">
    </div>
    <div class="sm-sep"></div>
    <div class="sm-actions">
      <button id="lockBtn">锁定</button>
      <button id="shutdownBtn">关机</button>
    </div>
  </div>
</div>

<div id="lockScreen">
  <div class="lock-time" id="lockTime">00:00</div>
  <div class="lock-date" id="lockDate"></div>
  <div class="lock-avatar">👤</div>
  <div class="lock-hint" id="lockHint">点击下方按钮解锁</div>
  <button id="unlockBtn">解锁</button>
</div>

<script>
/* =========================================================
   图标库

function normalize(path, base){
  base = base || '/';
  if(!path || path === '') path = base;
  if(path[0] !== '/') path = (base === '/' ? '' : base) + '/' + path;
  const out = [];
  for(const seg of path.split('/')){
    if(seg === '' || seg === '.') continue;
    if(seg === '..'){ out.pop(); continue; }
    out.push(seg);
  }
  return '/' + out.join('/');
}
function getNode(path, base){
  const p = normalize(path, base);
  if(p === '/') return FS;
  let node = FS;
  for(const seg of p.slice(1).split('/')){
    if(!node.children) return null;
    const next = node.children.find(c => c.name === seg);
    if(!next) return null;
    node = next;
  }
  return node;
}
function parentPath(p){ 
  p = normalize(p); 
  if(p === '/') return '/'; 
  const i = p.lastIndexOf('/'); 
  return i === 0 ? '/' : p.slice(0, i); 
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function el(tag, cls, html){
  const d = document.createElement(tag);
  if(cls) d.className = cls;
  if(html !== undefined) d.innerHTML = html;
  return d;
}

/* =========================================================
   窗口管理
   ========================================================= */
const windowLayer = $('#windowLayer');
const openWindows = [];
let zCounter = 100;
let winSeq = 0;
let spawnIdx = 0;
let overviewOn = false;

function nextSpawn(){
  const i = spawnIdx++ % 7;
  return {
    x: 96 + i * 30,
    y: 60 + i * 26
  };
}

function focusWindow(win){
  if(win.minimized) return;
  openWindows.forEach(w => w.el.classList.remove('active'));
  win.el.classList.add('active');
  win.z = ++zCounter;
  win.el.style.zIndex = win.z;
}

function applyBox(win){
  win.el.style.left = win.x + 'px';
  win.el.style.top = win.y + 'px';
  win.el.style.width = win.w + 'px';
  win.el.style.height = win.h + 'px';
}

function openWindow(opts){
  // 单例
  if(opts.appId){
    const exist = openWindows.find(w => w.appId === opts.appId);
    if(exist){
      if(exist.minimized){
        exist.minimized = false;
        exist.el.classList.remove('minimized');
      }
      if(overviewOn) exitOverview();
      focusWindow(exist);
      updateDock();
      if(opts.onReopen) opts.onReopen(exist);
      return exist;
    }
  }

  const w = opts.width || 820;
  const h = opts.height || 540;
  const pos = nextSpawn();

  const win = {
    id: 'win' + (++winSeq),
    appId: opts.appId || null,
    title: opts.title || '窗口',
    icon: opts.icon || '',
    x: pos.x, y: pos.y, w, h,
    minimized: false, maximized: false, prev: null,
    z: ++zCounter,
    api: {}
  };

  const node = el('div', 'window');
  node.style.left = win.x + 'px';
  node.style.top = win.y + 'px';
  node.style.width = win.w + 'px';
  node.style.height = win.h + 'px';
  node.style.zIndex = win.z;
  node.innerHTML = `
    <div class="win-header">
      <div class="win-title">${opts.icon || ''}<span>${esc(win.title)}</span></div>
      <div class="win-controls">
        <button class="wc wc-min" title="最小化">–</button>
        <button class="wc wc-max" title="最大化">□</button>
        <button class="wc wc-close" title="关闭">×</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="win-resizer"></div>
  `;
  win.el = node;

  const header = node.querySelector('.win-header');
  const body = node.querySelector('.win-body');
  const btnMin = node.querySelector('.wc-min');
  const btnMax = node.querySelector('.wc-max');
  const btnClose = node.querySelector('.wc-close');
  const resizer = node.querySelector('.win-resizer');

  // 内容渲染
  if(opts.render) opts.render(body, win);

  // 关闭
  btnClose.addEventListener('click', e => {
    e.stopPropagation();
    closeWindow(win);
  });
  // 最小化
  btnMin.addEventListener('click', e => {
    e.stopPropagation();
    win.minimized = true;
    node.classList.add('minimized');
    updateDock();
  });
  // 最大化
  btnMax.addEventListener('click', e => {
    e.stopPropagation();
    toggleMax(win);
  });
  // 双击标题栏最大化
  header.addEventListener('dblclick', e => {
    if(e.target.closest('.win-controls')) return;
    toggleMax(win);
  });

  // 聚焦
  node.addEventListener('mousedown', () => {
    if(overviewOn){ exitOverview(); }
    focusWindow(win);
  });

  // 拖动
  header.addEventListener('mousedown', e => {
    if(e.target.closest('.win-controls')) return;
    if(win.maximized) return;
    if(overviewOn) return;
    e.preventDefault();
    focusWindow(win);
    const sx = e.clientX, sy = e.clientY;
    const ox = win.x, oy = win.y;
    const maxY = window.innerHeight - 40;
    const maxX = window.innerWidth - 60;

    function onMove(ev){
      win.x = Math.min(maxX, Math.max(-win.w + 80, ox + ev.clientX - sx));
      win.y = Math.min(maxY, Math.max(30, oy + ev.clientY - sy));
      win.el.style.left = win.x + 'px';
      win.el.style.top = win.y + 'px';
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.body.style.cursor = 'grabbing';
  });

  // 调整大小
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    if(win.maximized) return;
    focusWindow(win);
    const sx = e.clientX, sy = e.clientY;
    const ow = win.w, oh = win.h;

    function onMove(ev){
      win.w = Math.max(320, ow + ev.clientX - sx);
      win.h = Math.max(200, oh + ev.clientY - sy);
      win.el.style.width = win.w + 'px';
      win.el.style.height = win.h + 'px';
      if(win.api.onResize) win.api.onResize();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  windowLayer.appendChild(node);
  openWindows.push(win);
  focusWindow(win);
  updateDock();
  return win;
}

function closeWindow(win){
  win.el.style.transition = 'opacity .15s, transform .15s';
  win.el.style.opacity = '0';
  win.el.style.transform = 'scale(.96)';
  setTimeout(() => {
    win.el.remove();
    const i = openWindows.indexOf(win);
    if(i >= 0) openWindows.splice(i, 1);
    const top = openWindows.filter(w => !w.minimized).sort((a,b) => b.z - a.z)[0];
    if(top) focusWindow(top);
    updateDock();
  }, 150);
}

function toggleMax(win){
  if(win.maximized){
    win.x = win.prev.x; win.y = win.prev.y;
    win.w = win.prev.w; win.h = win.prev.h;
    win.maximized = false;
  } else {
    win.prev = {x:win.x, y:win.y, w:win.w, h:win.h};
    win.x = 76; win.y = 38;
    win.w = window.innerWidth - 76 - 12;
    win.h = window.innerHeight - 38 - 12;
    win.maximized = true;
  }
  win.el.style.transition = 'all .18s ease';
  applyBox(win);
  setTimeout(() => { win.el.style.transition = ''; }, 190);
  if(win.api.onResize) win.api.onResize();
}

window.addEventListener('resize', () => {
  openWindows.forEach(w => {
    if(w.maximized){
      w.x = 76; w.y = 38;
      w.w = window.innerWidth - 76 - 12;
      w.h = window.innerHeight - 38 - 12;
      applyBox(w);
    }
    if(w.api.onResize) w.api.onResize();
  });
  if(overviewOn){ exitOverview(); }
});

/* =========================================================
   概览模式
   ========================================================= */
function enterOverview(){
  if(overviewOn) return;
  overviewOn = true;
  document.body.classList.add('overview');
  const input = $('#overviewInput');
  input.value = '';
  setTimeout(() => input.focus(), 120);

  const wins = openWindows.filter(w => !w.minimized);
  const n = wins.length;
  if(!n) return;

  const cols = Math.min(3, Math.ceil(Math.sqrt(n)));
  const rows = Math.ceil(n / cols);
  const padX = Math.max(90, (window.innerWidth - cols * 460) / 2);
  const topY = 130;
  const areaW = window.innerWidth - padX * 2;
  const areaH = window.innerHeight - topY - 60;
  const cellW = areaW / cols;
  const cellH = areaH / rows;

  wins.forEach((w, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = padX + col * cellW + cellW / 2;
    const cy = topY + row * cellH + cellH / 2;
    const scale = Math.min((cellW - 70) / w.w, (cellH - 70) / w.h, 1);
    const wx = w.x + w.w / 2;
    const wy = w.y + w.h / 2;

    w.el.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s';
    w.el.style.transformOrigin = 'center center';
    w.el.style.transform = `translate(${cx - wx}px, ${cy - wy}px) scale(${scale})`;
    w.el.style.zIndex = 200 + i;
    w.el.style.boxShadow = '0 18px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.12)';
  });
}

function exitOverview(){
  if(!overviewOn) return;
  overviewOn = false;
  document.body.classList.remove('overview');
  openWindows.forEach(w => {
    w.el.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s';
    w.el.style.transform = '';
    w.el.style.boxShadow = '';
    const z = w.z;
    setTimeout(() => {
      w.el.style.transition = '';
      w.el.style.transformOrigin = '';
      if(!w.minimized) w.el.style.zIndex = z;
    }, 310);
  });
}

$('#activitiesBtn').addEventListener('click', () => {
  if(overviewOn) exitOverview();
  else enterOverview();
});

$('#overviewInput').addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    e.target.blur();
    exitOverview();
    return;
  }
  if(e.key === 'Enter'){
    const q = e.target.value.trim().toLowerCase();
    if(!q) return;
    const wins = openWindows.filter(w => !w.minimized);
    let best = null, bestScore = -1;
    wins.forEach((w, i) => {
      const score = w.title.toLowerCase().includes(q) ? 100 - i : -1;
      if(score > bestScore){ bestScore = score; best = w; }
    });
    if(best && bestScore >= 0){
      exitOverview();
      setTimeout(() => focusWindow(best), 320);
    }
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(!$('#systemMenu').classList.contains('hidden')){
      $('#systemMenu').classList.add('hidden');
      return;
    }
    if(overviewOn){ exitOverview(); return; }
  }
  if(e.key === 'Meta' || (e.key === 'Super')){ /* 忽略 */ }
});

   应用：终端
   ========================================================= */
let cwd = '/home/user';
const cmdHistory = [];
let histIdx = -1;

function ps1HTML(){
  let p = cwd;
  if(p === '/home/user') p = '~';
  else if(p.startsWith('/home/user/')) p = '~' + p.slice(10);
  return `<span class="ps-user">user@ubuntu</span><span class="ps-sym">:</span><span class="ps-path">${esc(p)}</span><span class="ps-sym">$</span>`;
}

function renderTerminal(body, win){
  body.innerHTML = `<div class="app-terminal"><div class="term"></div></div>`;
  const term = body.querySelector('.term');
  const inputLine = el('div', 'term-line');
  inputLine.innerHTML = `<span class="ps1">${ps1HTML()}</span><input class="term-in" spellcheck="false" autocomplete="off" autocapitalize="off">`;
  const input = inputLine.querySelector('input');
  term.appendChild(inputLine);

  const histEl = el('div', 'term-row');
  histEl.innerHTML = `<span class="term-info">Ubuntu 24.04.1 LTS  (GNU/Linux 6.8.0-31-generic x86_64)</span>\n\n输入 <b>help</b> 查看可用命令。\n`;
  term.insertBefore(histEl, inputLine);

  function scrollDown(){ term.scrollTop = term.scrollHeight; }
  scrollDown();

  function write(html){
    const row = el('div', 'term-row');
    row.innerHTML = html === '' ? '&nbsp;' : html;
    term.insertBefore(row, inputLine);
    scrollDown();
  }

  term.addEventListener('click', e => {
    if(window.getSelection().toString()) return;
    input.focus();
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const line = input.value;
      input.value = '';
      run(line);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(!cmdHistory.length) return;
      histIdx = histIdx < 0 ? cmdHistory.length - 1 : Math.max(0, histIdx - 1);
      input.value = cmdHistory[histIdx];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(histIdx < 0) return;
      histIdx++;
      if(histIdx >= cmdHistory.length){ histIdx = -1; input.value = ''; }
      else input.value = cmdHistory[histIdx];
    } else if(e.key === 'l' && e.ctrlKey){
      e.preventDefault();
      term.querySelectorAll('.term-row').forEach(r => r.remove());
    } else if(e.key === 'c' && e.ctrlKey){
      e.preventDefault();
      write(`<span class="ps1">${ps1HTML()}</span> ${esc(input.value)}<span style="color:#ff6b6b">^C</span>`);
      input.value = '';
    }
  });

  function updatePS1(){
    inputLine.querySelector('.ps1').innerHTML = ps1HTML();
  }

  function run(raw){
    const line = raw.trim();
    write(`<span class="ps1">${ps1HTML()}</span> <span style="color:#fff">${esc(line)}</span>`);
    if(line){
      cmdHistory.push(line);
      histIdx = -1;
    }
    if(!line) return;

    const parts = line.match(/(?:[^\s"]+|"[^"]*")+/g).map(s => s.replace(/^"|"$/g, ''));
    const cmd = parts[0];
    const args = parts.slice(1);

    switch(cmd){
      case 'help':
        write(
`<span class="term-info">可用命令：</span>
  <b>help</b>          显示此帮助
  <b>ls</b> [路径]      列出目录内容
  <b>cd</b> [路径]      切换目录
  <b>pwd</b>            显示当前路径
  <b>cat</b> &lt;文件&gt;      查看文件内容
  <b>echo</b> &lt;文本&gt;     输出文本
  <b>mkdir</b> &lt;名称&gt;     创建目录
  <b>rm</b> &lt;文件&gt;       删除文件
  <b>tree</b>           以树形显示目录
  <b>date</b>           显示当前时间
  <b>whoami</b>         显示当前用户
  <b>uname</b> -a       显示系统信息
  <b>neofetch</b>       显示系统概览
  <b>history</b>        显示命令历史
  <b>clear</b>          清屏
  <b>exit</b>           关闭终端`);
        break;

      case 'ls': {
        const target = args.filter(a => !a.startsWith('-'))[0];
        const node = getNode(target || cwd, cwd);
        if(!node){ write(`<span class="term-err">ls: 无法访问 '${esc(target)}': 没有那个文件或目录</span>`); break; }
        if(node.type === 'file'){ write(esc(node.name)); break; }
        const showAll = args.some(a => a.includes('a'));
        const list = node.children.filter(c => showAll || !c.name.startsWith('.'));
        if(!list.length){ write(''); break; }
        const items = list.map(c => {
          if(c.type === 'dir') return `<span class="ls-dir">${esc(c.name)}</span>`;
          if(/\.(sh|bin|run)$/.test(c.name)) return `<span class="ls-exec">${esc(c.name)}</span>`;
          return esc(c.name);
        });
        if(args.includes('-l') || args.includes('-la') || args.includes('-al')){
          write(list.map(c => {
            const perm = c.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--';
            const size = c.type === 'dir' ? 4096 : (c.content ? c.content.length : 0);
            const name = c.type === 'dir' ? `<span class="ls-dir">${esc(c.name)}</span>` : esc(c.name);
            return `${perm} 1 user user ${String(size).padStart(6)} 9月 26 10:24 ${name}`;
          }).join('\n'));
        } else {
          write(items.join('   '));
        }
        break;
      }

      case 'cd': {
        const target = args[0] || '/home/user';
        const np = normalize(target, cwd);
        const node = getNode(np);
        if(!node){ write(`<span class="term-err">bash: cd: ${esc(target)}: 没有那个文件或目录</span>`); break; }
        if(node.type !== 'dir'){ write(`<span class="term-err">bash: cd: ${esc(target)}: 不是目录</span>`); break; }
        cwd = np;
        updatePS1();
        break;
      }

      case 'pwd': write(esc(cwd)); break;

      case 'cat': {
        if(!args[0]){ write('<span class="term-err">cat: 缺少操作数</span>'); break; }
        const node = getNode(args[0], cwd);
        if(!node){ write(`<span class="term-err">cat: ${esc(args[0])}: 没有那个文件或目录</span>`); break; }
        if(node.type === 'dir'){ write(`<span class="term-err">cat: ${esc(args[0])}: 是一个目录</span>`); break; }
        write(esc(node.content || ''));
        break;
      }

      case 'echo': write(esc(args.join(' '))); break;

      case 'mkdir': {
        if(!args[0]){ write('<span class="term-err">mkdir: 缺少操作数</span>'); break; }
        const parent = getNode(cwd);
        const name = args[0].replace(/\/$/, '');
        if(parent.children.some(c => c.name === name)){ write(`<span class="term-err">mkdir: 无法创建目录 '${esc(name)}': 文件已存在</span>`); break; }
        parent.children.push({ name, type:'dir', children:[] });
        write(`<span class="term-info">已创建目录 '${esc(name)}'</span>`);
        break;
      }

      case 'rm': {
        const name = args.filter(a => !a.startsWith('-'))[0];
        if(!name){ write('<span class="term-err">rm: 缺少操作数</span>'); break; }
        if(name === '/' || name === '/*'){ write('<span class="term-err">rm: 拒绝删除根目录 :) 想得美</span>'); break; }
        const parent = getNode(cwd);
        const idx = parent.children.findIndex(c => c.name === name);
        if(idx < 0){ write(`<span class="term-err">rm: 无法删除 '${esc(name)}': 没有那个文件或目录</span>`); break; }
        if(parent.children[idx].type === 'dir' && !args.some(a => a.includes('r'))){
          write(`<span class="term-err">rm: 无法删除 '${esc(name)}': 是一个目录</span>`); break;
        }
        parent.children.splice(idx, 1);
        write(`<span class="term-info">已删除 '${esc(name)}'</span>`);
        break;
      }

      case 'tree': {
        let out = `<span class="ls-dir">${esc(cwd)}</span>\n`;
        const root = getNode(cwd);
        (function walk(node, prefix){
          const kids = node.children.filter(c => !c.name.startsWith('.'));
          kids.forEach((c, i) => {
            const last = i === kids.length - 1;
            out += prefix + (last ? '└── ' : '├── ') +
              (c.type === 'dir' ? `<span class="ls-dir">${esc(c.name)}</span>` : esc(c.name)) + '\n';
            if(c.type === 'dir' && c.children.length){
              walk(c, prefix + (last ? '    ' : '│   '));
            }
          });
        })(root, '');
        write(out);
        break;
      }

      case 'date': write(new Date().toString()); break;
      case 'whoami': write('user'); break;
      case 'hostname': write('ubuntu'); break;

      case 'uname':
        write(args.includes('-a')
          ? 'Linux ubuntu 6.8.0-31-generic #31-Ubuntu SMP PREEMPT_DYNAMIC x86_64 GNU/Linux'
          : 'Linux');
        break;

      case 'neofetch': {
        const up = Math.floor((Date.now() - startTime) / 1000);
        const hh = Math.floor(up / 3600), mm = Math.floor(up % 3600 / 60);
        write(
`<span style="color:#e95420">            .-/+oossssoo+/-.</span>            <span class="ps-user">user@ubuntu</span>
<span style="color:#e95420">        \`:+ssssssssssssssssss+:\`</span>        <span class="ps-sym">-----------</span>
<span style="color:#e95420">      -+ssssssssssssssssssyyssss+-</span>      <span style="color:#8ae234">OS</span>: Ubuntu 24.04.1 LTS x86_64
<span style="color:#e95420">    .ossssssssssssssssss</span><span style="color:#fff">dMMMNy</span><span style="color:#e95420">sssso-</span>     <span style="color:#8ae234">Kernel</span>: 6.8.0-31-generic
<span style="color:#e95420">   /ssssssssss</span><span style="color:#fff">hdmmNNmmyNMMMMh</span><span style="color:#e95420">ssssss/</span>    <span style="color:#8ae234">Uptime</span>: ${hh} 小时 ${mm} 分钟
<span style="color:#e95420">  +sssssssss</span><span style="color:#fff">hmydMMMMMMMNdddd</span><span style="color:#e95420">ysssssss+</span>   <span style="color:#8ae234">Shell</span>: bash 5.2.21
<span style="color:#e95420"> +sssssssss</span><span style="color:#fff">hNmyyhYYYYYYYYYh</span><span style="color:#e95420">sssssssss+</span>  <span style="color:#8ae234">DE</span>: GNOME 46
<span style="color:#e95420"> .sssssssss</span><span style="color:#fff">mdddddmydmmNm</span><span style="color:#e95420">sssssssss.</span>   <span style="color:#8ae234">WM</span>: Mutter
<span style="color:#e95420">  +sssssssss</span><span style="color:#fff">smNNmmNmmmNmm</span><span style="color:#e95420">ssssssss+</span>   <span style="color:#8ae234">Terminal</span>: GNOME Terminal
<span style="color:#e95420">   +sssssssss</span><span style="color:#fff">hmmmmmmmmmm</span><span style="color:#e95420">sssssss+</span>    <span style="color:#8ae234">CPU</span>: Virtual CPU (2) @ 3.0GHz
<span style="color:#e95420">    .sssssssssss</span><span style="color:#fff">hmNNNNmm</span><span style="color:#e95420">ssssss.</span>     <span style="color:#8ae234">Memory</span>: 2048MiB / 8192MiB
<span style="color:#e95420">      -+sssssssssssssssss</span><span style="color:#fff">yy</span><span style="color:#e95420">ssss+-</span>
<span style="color:#e95420">        \`:+ssssssssssssssssss+:\`</span>
<span style="color:#e95420">            .-/+oossssoo+/-.</span>`);
        break;
      }

      case 'history':
        write(cmdHistory.map((c, i) => `  ${String(i + 1).padStart(4)}  ${esc(c)}`).join('\n'));
        break;

      case 'clear':
        term.querySelectorAll('.term-row').forEach(r => r.remove());
        break;

      case 'exit':
        closeWindow(win);
        break;

      case 'sudo':
        write(`<span class="term-err">user 不在 sudoers 文件中。此事将被报告。 😈</span>`);
        break;

      case 'top':
      case 'htop':
        write(
`<span class="term-info">Tasks:</span> 128 total,   1 running, 127 sleeping
<span class="term-info">%Cpu(s):</span>  2.3 us,  0.8 sy, 96.9 id
<span class="term-info">MiB Mem :</span> 8192.0 total,  2048.3 free,  3102.7 used
<span class="term-info">MiB Swap:</span> 2048.0 total,  2048.0 free,     0.0 used

  PID USER      PR  NI    VIRT    RES  %CPU  %MEM     TIME+ COMMAND
 1024 user      20   0  512000  88000   2.3   1.1   0:12.44 gnome-shell
 2048 user      20   0  320000  42000   0.8   0.5   0:03.21 Xorg
 3072 user      20   0  180000  22000   0.4   0.3   0:01.10 bash`);
        break;

      case 'poweroff':
      case 'reboot':
        write('<span class="term-info">需要 root 权限。</span>');
        break;

      case 'lsblk':
        write(`NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT
sda      8:0    0   64G  0 disk
├─sda1   8:1    0  512M  0 part /boot/efi
└─sda2   8:2    0 63.5G  0 part /`);
        break;

      case 'df':
        write(`文件系统        1K-块     已用     可用 已用% 挂载点
/dev/sda2     65686320 12874432 49464704   21% /
tmpfs          4194304        0  4194304    0% /dev/shm`);
        break;

      default:
        write(`<span class="term-err">bash: ${esc(cmd)}: 未找到命令</span>`);
    }
  }
}

   应用：文件管理器
   ========================================================= */
function renderFiles(body, win){
  body.innerHTML = `
    <div class="app-files">
      <div class="files-sidebar"></div>
      <div class="files-main">
        <div class="files-toolbar">
          <button class="f-back" title="后退">${ICON.back}</button>
          <button class="f-fwd" title="前进">${ICON.fwd}</button>
          <button class="f-up" title="上级目录">${ICON.up}</button>
          <div class="crumbs"></div>
          <button class="f-refresh" title="刷新">${ICON.refresh}</button>
        </div>
        <div class="files-grid"></div>
        <div class="files-status">—</div>
      </div>
    </div>`;

  let path = '/home/user';
  let history = ['/home/user'];
  let histPos = 0;

  const sidebar = body.querySelector('.files-sidebar');
  const grid = body.querySelector('.files-grid');
  const crumbs = body.querySelector('.crumbs');
  const status = body.querySelector('.files-status');
  const backBtn = body.querySelector('.f-back');
  const fwdBtn = body.querySelector('.f-fwd');

  const places = [
    { label:'主目录', path:'/home/user', icon: ICON.home },
    { label:'桌面', path:'/home/user/Desktop', icon: ICON.folder },
    { label:'文档', path:'/home/user/Documents', icon: ICON.doc },
    { label:'下载', path:'/home/user/Downloads', icon: ICON.download },
    { label:'图片', path:'/home/user/Pictures', icon: ICON.image },
    { label:'音乐', path:'/home/user/Music', icon: ICON.music },
    { label:'计算机', path:'/', icon: ICON.grid },
    { label:'回收站', path:'/tmp', icon: ICON.trash }
  ];

  const title = el('div', 'side-title', '位置');
  sidebar.appendChild(title);
  places.forEach(p => {
    const item = el('div', 'side-item', `${p.icon}<span>${p.label}</span>`);
    item.dataset.path = p.path;
    item.addEventListener('click', () => go(p.path));
    sidebar.appendChild(item);
  });

  function go(p, noHistory){
    const node = getNode(p);
    if(!node || node.type !== 'dir') return;
    path = normalize(p);
    if(!noHistory){
      history = history.slice(0, histPos + 1);
      history.push(path);
      histPos = history.length - 1;
    }
    render();
  }

  function render(){
    const node = getNode(path);
    if(!node){ go('/home/user'); return; }

    // 面包屑
    crumbs.innerHTML = '';
    const segs = path === '/' ? [] : path.slice(1).split('/');
    const rootCrumb = el('span', 'crumb', '计算机');
    rootCrumb.addEventListener('click', () => go('/'));
    crumbs.appendChild(rootCrumb);
    let acc = '';
    segs.forEach(s => {
      acc += '/' + s;
      crumbs.appendChild(el('span', 'crumb-sep', '›'));
      const c = el('span', 'crumb', esc(s));
      const target = acc;
      c.addEventListener('click', () => go(target));
      crumbs.appendChild(c);
    });

    // 侧栏高亮
    sidebar.querySelectorAll('.side-item').forEach(i => {
      i.classList.toggle('active', i.dataset.path === path);
    });

    // 内容
    grid.innerHTML = '';
    const items = node.children.filter(c => !c.name.startsWith('.')).slice()
      .sort((a, b) => {
        if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

    if(!items.length){
      const empty = el('div', '', '<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:50px;font-size:13px">此文件夹为空</div>');
      grid.appendChild(empty);
    }

    items.forEach(item => {
      const d = el('div', 'file-item');
      d.innerHTML = `${item.type === 'dir' ? ICON.folder : ICON.file}<span>${esc(item.name)}</span>`;
      d.addEventListener('click', e => {
        e.stopPropagation();
        grid.querySelectorAll('.file-item').forEach(x => x.classList.remove('selected'));
        d.classList.add('selected');
      });
      d.addEventListener('dblclick', () => {
        if(item.type === 'dir'){
          go(path === '/' ? '/' + item.name : path + '/' + item.name);
        } else {
          openWindow({
            appId: 'editor',
            title: item.name + ' — 文本编辑器',
            icon: ICON.editor,
            width: 760, height: 520,
            render: (b, w) => renderEditor(b, w, item),
            onReopen: (w) => w.api.load && w.api.load(item)
          });
        }
      });
      grid.appendChild(d);
    });

    status.textContent = `${items.length} 个项目`;
    backBtn.disabled = histPos <= 0;
    fwdBtn.disabled = histPos >= history.length - 1;

    win.title = path === '/' ? '计算机' : path.split('/').pop() || '文件';
    const t = win.el.querySelector('.win-title span');
    if(t) t.textContent = win.title + ' — 文件';
  }

  backBtn.addEventListener('click', () => {
    if(histPos > 0){ histPos--; go(history[histPos], true); }
  });
  fwdBtn.addEventListener('click', () => {
    if(histPos < history.length - 1){ histPos++; go(history[histPos], true); }
  });
  body.querySelector('.f-up').addEventListener('click', () => go(parentPath(path)));
  body.querySelector('.f-refresh').addEventListener('click', render);
  grid.addEventListener('click', () => {
    grid.querySelectorAll('.file-item').forEach(x => x.classList.remove('selected'));
  });

  win.api.go = go;
  render();
}

/* =========================================================
   应用：文本编辑器
   ========================================================= */
function renderEditor(body, win, file){
  body.innerHTML = `
    <div class="app-editor">
      <div class="editor-toolbar">
        <button class="e-new">新建</button>
        <button class="e-save">保存</button>
        <span class="filename"></span>
      </div>
      <div class="editor-wrap">
        <div class="editor-lines">1</div>
        <textarea class="editor-text" spellcheck="false"></textarea>
      </div>
    </div>`;

  const ta = body.querySelector('.editor-text');
  const linesEl = body.querySelector('.editor-lines');
  const fname = body.querySelector('.filename');

  let current = file || { name:'未命名.txt', content:'' };

  function load(f){
    current = f;
    ta.value = f.content || '';
    fname.textContent = f.name + (f.type === 'dir' ? '' : '');
    win.title = f.name + ' — 文本编辑器';
    const t = win.el.querySelector('.win-title span');
    if(t) t.textContent = win.title;
    updateLines();
    ta.scrollTop = 0;
    linesEl.scrollTop = 0;
  }

  function updateLines(){
    const n = ta.value.split('\n').length;
    let s = '';
    for(let i = 1; i <= n; i++) s += i + '\n';
    linesEl.textContent = s;
    linesEl.scrollTop = ta.scrollTop;
  }

  ta.addEventListener('input', updateLines);
  ta.addEventListener('scroll', () => { linesEl.scrollTop = ta.scrollTop; });
  ta.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      updateLines();
    }
  });

/* =========================================================
   应用：计算器
   ========================================================= */
function renderCalc(body){
  body.innerHTML = `
    <div class="app-calc">
      <div class="calc-display">
        <div class="calc-expr"></div>
        <div class="calc-result">0</div>
      </div>
      <div class="calc-grid"></div>
    </div>`;

  const exprEl = body.querySelector('.calc-expr');
  const resEl = body.querySelector('.calc-result');
  const grid = body.querySelector('.calc-grid');

  let expr = '';
  let justEvaluated = false;

  const keys = [
    { t:'C', c:'fn' }, { t:'⌫', c:'fn' }, { t:'%', c:'fn' }, { t:'÷', c:'op' },
    { t:'7' }, { t:'8' }, { t:'9' }, { t:'×', c:'op' },
    { t:'4' }, { t:'5' }, { t:'6' }, { t:'−', c:'op' },
    { t:'1' }, { t:'2' }, { t:'3' }, { t:'+', c:'op' },
    { t:'±', c:'fn' }, { t:'0' }, { t:'.' }, { t:'=', c:'eq' }
  ];

  keys.forEach(k => {
    const b = el('button', 'calc-btn' + (k.c ? ' ' + k.c : ''), k.t);
    b.addEventListener('click', () => press(k.t));
    grid.appendChild(b);
  });

  function pretty(s){
    return s.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/-/g, ' − ').replace(/\+/g, ' + ');
  }

  function compute(){
    let s = expr
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-');
    s = s.replace(/%/g, '/100');
    if(!/^[-+*/().\d\s]+$/.test(s)) return null;
    try{
      // eslint-disable-next-line no-new-func
      const v = Function('"use strict";return (' + s + ')')();
      if(typeof v !== 'number' || !isFinite(v)) return null;
      return Math.round(v * 1e10) / 1e10;
    }catch(err){ return null; }
  }

  function refresh(){
    exprEl.textContent = pretty(expr) || '\u00A0';
    if(!justEvaluated){
      const v = expr === '' ? 0 : compute();
      resEl.textContent = v === null ? '…' : v;
    }
  }

  function press(k){
    if(k === 'C'){ expr = ''; justEvaluated = false; resEl.textContent = '0'; refresh(); return; }
    if(k === '⌫'){
      if(justEvaluated){ expr = ''; justEvaluated = false; }
      expr = expr.slice(0, -1);
      refresh(); return;
    }
    if(k === '±'){
      if(expr.startsWith('-')) expr = expr.slice(1);
      else expr = '-' + expr;
      refresh(); return;
    }
    if(k === '='){
      const v = compute();
      if(v !== null){
        exprEl.textContent = pretty(expr) + ' =';
        resEl.textContent = v;
        expr = String(v);
        justEvaluated = true;
      }
      return;
    }
    const isOp = ['+','−','×','÷'].includes(k);
    if(justEvaluated){
      if(isOp){ justEvaluated = false; }
      else { expr = ''; justEvaluated = false; }
    }
    // 避免连续运算符
    if(isOp && /[+\-−×÷]$/.test(expr)){
      expr = expr.slice(0, -1);
    }
    if(k === '%'){
      expr += '%';
    } else {
      expr += k;
    }
    refresh();
  }

  document.addEventListener('keydown', function handler(e){
    if(!body.isConnected){
      document.removeEventListener('keydown', handler);
      return;
    }
    if(overviewOn) return;
    const win = openWindows.find(w => w.el.contains(body));
    if(!win || !win.el.classList.contains('active')) return;
    if(/^[0-9.]$/.test(e.key)) press(e.key);
    else if(e.key === '+') press('+');
    else if(e.key === '-') press('−');
    else if(e.key === '*') press('×');
    else if(e.key === '/') press('÷');
    else if(e.key === 'Enter' || e.key === '=') press('=');
    else if(e.key === 'Backspace') press('⌫');
    else if(e.key === 'Escape') press('C');
    else return;
    e.preventDefault();
  });
}

/* =========================================================
   时钟
   ========================================================= */
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function updateClock(){
  const d = new Date();
  const t = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  $('#clock').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]} ${t}`;
  $('#lockTime').textContent = t;
  $('#lockDate').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
}
updateClock();
setInterval(updateClock, 1000);

/* =========================================================
   锁屏 / 关机
   ========================================================= */
const lockScreen = $('#lockScreen');
$('#lockBtn').addEventListener('click', () => {
  systemMenu.classList.add('hidden');
  lockScreen.classList.add('show');
  $('#lockHint').textContent = '点击下方按钮解锁';
  $('#unlockBtn').classList.remove('hidden');
});
$('#unlockBtn').addEventListener('click', () => {
  lockScreen.classList.remove('show');
});
$('#shutdownBtn').addEventListener('click', () => {
  systemMenu.classList.add('hidden');
  lockScreen.classList.add('show');
  lockScreen.style.background = '#000';
  $('#lockHint').textContent = '系统已关机';
  $('#unlockBtn').textContent = '重新开机';
  setTimeout(() => {
    lockScreen.style.background = '';
  }, 400);
});
lockScreen.addEventListener('click', e => {
  if(e.target === lockScreen){
    lockScreen.classList.remove('show');
    $('#unlockBtn').textContent = '解锁';
  }
});
