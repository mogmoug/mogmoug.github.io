<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学实验室模拟器 - 高锰酸钾制氧气</title>
    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --bg-dark: #1a2a3a;
            --text-primary: #1a2a3a;
            --text-secondary: #4a5a6a;
            --text-light: #ffffff;
            --accent: #2e86c1;
            --accent-dark: #1a5276;
            --accent-light: #d4e6f1;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --glass-border: rgba(200, 220, 240, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.18);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font-mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(46, 134, 193, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(26, 82, 118, 0.08) 0%, transparent 60%),
                linear-gradient(180deg, #f0f4f8 0%, #e8ecf1 100%);
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .header {
            background: var(--bg-dark);
            border-radius: var(--radius-md);
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-md);
            background-image: linear-gradient(135deg, #1a2a3a 0%, #1e3a5f 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2e86c1, #1a5276);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(46, 134, 193, 0.4);
            flex-shrink: 0;
        }
        .header-title h1 {
            color: var(--text-light);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .header-title p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #95a5a6;
            transition: var(--transition);
            animation: pulse-dot 2s infinite;
        }
        .status-dot.active {
            background: #f39c12;
            box-shadow: 0 0 12px #f39c12;
            animation: pulse-dot-active 1s infinite;
        }
        .status-dot.success {
            background: #27ae60;
            box-shadow: 0 0 12px #27ae60;
            animation: pulse-dot 2s infinite;
        }
        .status-text {
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 500;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }
        @keyframes pulse-dot-active {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 8px #f39c12;
            }
            50% {
                opacity: 0.7;
                transform: scale(1.3);
                box-shadow: 0 0 20px #f39c12;
            }
        }

        /* ===== Main Layout ===== */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        @media (max-width: 1000px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Lab Bench ===== */
        .lab-bench {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }
        .lab-bench-header {
            padding: 12px 20px;
            background: linear-gradient(135deg, #f8fafc, #eef2f6);
            border-bottom: 1px solid #e0e6ec;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .lab-bench-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bench-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--accent-light);
            color: var(--accent-dark);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .svg-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: linear-gradient(180deg, #fdfefe 0%, #f5f7f9 100%);
            min-height: 400px;
            position: relative;
        }
        .svg-container svg {
            width: 100%;
            height: auto;
            max-height: 520px;
            border-radius: var(--radius-sm);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.06));
        }

        /* ===== Info Panel ===== */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 700px;
        }
        .info-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
        }
        .info-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        .info-card h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .info-card h3 .icon {
            font-size: 1rem;
        }
        .reagent-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .reagent-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
            font-size: 0.8rem;
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 4px;
        }
        .reagent-item .name {
            font-weight: 600;
            color: var(--text-primary);
        }
        .reagent-item .formula {
            font-family: var(--font-mono);
            color: var(--accent-dark);
            font-size: 0.75rem;
            background: var(--accent-light);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .reagent-item .amount {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        .reagent-color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.8rem;
            border-bottom: 1px dashed #e8ecf0;
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-row .label {
            color: var(--text-secondary);
        }
        .data-row .value {
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--text-primary);
        }
        .data-row .value.highlight {
            color: var(--accent-dark);
            font-size: 1rem;
        }
        .temp-bar {
            width: 100%;
            height: 6px;
            background: #e8ecf0;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
            position: relative;
        }
        .temp-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
            background: linear-gradient(90deg, #3498db, #f39c12, #e74c3c);
        }
        .reaction-display {
            background: #1a2a3a;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.6;
            margin-top: 6px;
        }
        .reaction-display .condition {
            color: #f39c12;
            font-weight: 600;
        }
        .reaction-display.active {
            border: 1px solid #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
            animation: reaction-glow 1.5s infinite;
        }
        @keyframes reaction-glow {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(243, 156, 18, 0.2);
            }
            50% {
                box-shadow: 0 0 25px rgba(243, 156, 18, 0.5);
            }
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8ecf0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #2e86c1, #27ae60);
            transition: width 0.3s ease;
        }

        /* ===== Controls ===== */
        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--glass-border);
        }
        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2e86c1, #1a5276);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46, 134, 193, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: #fff;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #d68910);
            color: #fff;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--accent-dark);
            border: 2px solid var(--accent);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--accent-light);
            box-shadow: none;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 6px;
        }

        /* ===== Guide ===== */
        .guide-section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .guide-header {
            padding: 14px 20px;
            background: linear-gradient(135deg, #f8fafc, #eef2f6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            border-bottom: 1px solid #e0e6ec;
        }
        .guide-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .guide-content {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            max-height: 320px;
            overflow-y: auto;
        }
        .guide-step {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            border-left: 3px solid transparent;
        }
        .guide-step.active {
            border-left-color: var(--success);
            background: #f0faf4;
        }
        .guide-step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .guide-step.active .guide-step-number {
            background: var(--success);
        }
        .guide-step-text {
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }
        .guide-step-text strong {
            color: var(--text-primary);
        }

        /* ===== Tooltip ===== */
        .tooltip {
            position: fixed;
            background: var(--bg-dark);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 280px;
            line-height: 1.5;
        }
        .tooltip.visible {
            opacity: 1;
        }

        /* ===== Scrollbar ===== */
        .info-panel::-webkit-scrollbar,
        .guide-content::-webkit-scrollbar {
            width: 6px;
        }
        .info-panel::-webkit-scrollbar-track,
        .guide-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .info-panel::-webkit-scrollbar-thumb,
        .guide-content::-webkit-scrollbar-thumb {
            background: #c0c8d0;
            border-radius: 3px;
        }
        .info-panel::-webkit-scrollbar-thumb:hover,
        .guide-content::-webkit-scrollbar-thumb:hover {
            background: #a0a8b0;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .app-container {
                padding: 8px;
                gap: 8px;
            }
            .header {
                padding: 12px 16px;
            }
            .header-title h1 {
                font-size: 1.1rem;
            }
            .main-content {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .svg-container {
                min-height: 280px;
                padding: 6px;
            }
            .controls-section {
                padding: 8px;
                gap: 4px;
            }
            .btn {
                padding: 7px 12px;
                font-size: 0.7rem;
            }
            .guide-content {
                grid-template-columns: 1fr;
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon">⚗️</div>
                <div class="header-title">
                    <h1>化学实验室模拟器</h1>
                    <p>高锰酸钾制取氧气 · 初中化学实验</p>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">就绪</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Lab Bench with SVG -->
            <div class="lab-bench">
                <div class="lab-bench-header">
                    <h2>🔬 实验台 <span class="bench-badge">排水法收集氧气</span></h2>
                    <span id="benchTemp" style="font-size:0.8rem;color:var(--text-secondary);font-family:var(--font-mono);">环境温度: 25.0°C</span>
                </div>
                <div class="svg-container">
                    <svg id="labSvg" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
                        <!-- SVG content will be rendered dynamically -->
                    </svg>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel" id="infoPanel">
                <!-- Cards rendered dynamically -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-section" id="controlsSection">
            <!-- Buttons rendered dynamically -->
        </div>

        <!-- Guide -->
        <div class="guide-section">
            <div class="guide-header" onclick="toggleGuide()">
                <h2>📋 操作指南 <span style="font-size:0.7rem;color:var(--text-secondary);font-weight:400;">点击展开/收起</span></h2>
                <span id="guideToggleIcon" style="font-size:1.2rem;">▾</span>
            </div>
            <div class="guide-content" id="guideContent">
                <!-- Guide steps rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // =============================================
        // ================== MODEL ====================
        // =============================================
        const Model = {
            // Reagent database
            reagents: {
                KMnO4: {
                    id: 'KMnO4',
                    name: '高锰酸钾',
                    formula: 'KMnO₄',
                    color: '#4a1a5e',
                    state: '固体',
                    molarMass: 158.03,
                    description: '紫黑色晶体，强氧化剂',
                    defaultAmount: 0.02 // mol
                },
                MnO2: {
                    id: 'MnO2',
                    name: '二氧化锰',
                    formula: 'MnO₂',
                    color: '#1a1a1a',
                    state: '固体',
                    molarMass: 86.94,
                    description: '黑色粉末，常用催化剂',
                    defaultAmount: 0.005
                },
                H2O2: {
                    id: 'H2O2',
                    name: '过氧化氢',
                    formula: 'H₂O₂',
                    color: 'transparent',
                    state: '液体',
                    molarMass: 34.01,
                    description: '无色液体，俗称双氧水',
                    defaultAmount: 0.1,
                    concentration: 0.5 // mol/L
                },
                H2O: {
                    id: 'H2O',
                    name: '水',
                    formula: 'H₂O',
                    color: 'transparent',
                    state: '液体',
                    molarMass: 18.02,
                    description: '用于排水法收集气体',
                    defaultAmount: 5
                },
                K2MnO4: {
                    id: 'K2MnO4',
                    name: '锰酸钾',
                    formula: 'K₂MnO₄',
                    color: '#1a5e2a',
                    state: '固体',
                    molarMass: 197.13,
                    description: '墨绿色固体，高锰酸钾分解产物',
                    defaultAmount: 0
                },
                O2: {
                    id: 'O2',
                    name: '氧气',
                    formula: 'O₂',
                    color: 'transparent',
                    state: '气体',
                    molarMass: 32.00,
                    description: '无色无味气体，支持燃烧',
                    defaultAmount: 0
                }
            },

            // Container states
            containers: {
                testTube: {
                    id: 'testTube',
                    name: '试管',
                    contents: [], // [{reagentId, amount}]
                    temperature: 25, // °C
                    volume: 50, // mL
                    maxVolume: 60,
                    cottonPlaced: false,
                    connectedToTube: false
                },
                beaker: {
                    id: 'beaker',
                    name: '烧杯',
                    contents: [],
                    temperature: 25,
                    volume: 250,
                    maxVolume: 300
                },
                measuringCylinder: {
                    id: 'measuringCylinder',
                    name: '量筒',
                    contents: [],
                    temperature: 25,
                    volume: 50,
                    maxVolume: 50
                },
                gasJar: {
                    id: 'gasJar',
                    name: '集气瓶',
                    contents: [],
                    temperature: 25,
                    volume: 250,
                    maxVolume: 250,
                    oxygenCollected: 0, // mol
                    waterLevel: 1.0, // 1 = full water, 0 = empty
                    isCollecting: false
                },
                waterTrough: {
                    id: 'waterTrough',
                    name: '水槽',
                    contents: [{ reagentId: 'H2O', amount: 5 }],
                    temperature: 25,
                    volume: 3000,
                    maxVolume: 4000
                }
            },

            // Equipment states
            equipment: {
                alcoholLamp: {
                    lit: false,
                    flameIntensity: 0, // 0-1
                    position: 'underTube' // 'underTube' | 'away'
                },
                ironStand: { assembled: true },
                ironClamp: { holdingTube: true },
                tubeConnected: false,
                deliveryTube: {
                    inWater: false,
                    inGasJar: false
                },
                cottonPlaced: false,
                gasJarInverted: true,
                experimentPhase: 'idle' // 'idle' | 'loaded' | 'assembled' | 'heating' | 'reacting' | 'collecting' | 'complete' | 'finished'
            },

            renderGuide() {

            renderStatus() {

                if (rx.active) {

                    text.textContent = '🔴 反应进行中';
                } else if (eq.experimentPhase === 'complete' || eq.experimentPhase === 'finished') {
                    dot.className = 'status-dot success';
                    text.textContent = '✅ 实验完成';
                } else if (eq.alcoholLamp.lit) {
                    dot.className = 'status-dot active';
                    text.textContent = '🟠 加热中';
                } else {
                    dot.className = 'status-dot';
                    text.textContent = '🔵 就绪';
                }
            },

            renderBenchTemp() {
                const el = document.getElementById('benchTemp');
                el.textContent = `环境温度: ${Model.settings.roomTemp.toFixed(1)}°C | 试管: ${Model.containers.testTube.temperature.toFixed(1)}°C`;
            },

            showTooltip(x, y, text) {
                const tooltip = document.getElementById('tooltip');
                tooltip.textContent = text;
                tooltip.style.left = (x + 15) + 'px';
                tooltip.style.top = (y + 15) + 'px';
                tooltip.classList.add('visible');
            },

            hideTooltip() {
                document.getElementById('tooltip').classList.remove('visible');
            }
        };

        // Helper function for guide active state
        function ttHasKMnO4() {
            return Model.containers.testTube.contents.some(c => c.reagentId === 'KMnO4');
        }

        // =============================================
        // ================ CONTROLLER =================
        // =============================================
        const Controller = {
            simulationInterval: null,
            lastUpdateTime: 0,

            init() {
                this.setupEventListeners();
                this.startSimulationLoop();
                View.render();
            },

            setupEventListeners() {
                // SVG hover tooltips
                document.addEventListener('mousemove', (e) => {
                    const svg = document.getElementById('labSvg');
                    const rect = svg.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const scaleX = 900 / rect.width;
                    const scaleY = 560 / rect.height;
                    const svgX = x * scaleX;
                    const svgY = y * scaleY;

                    // Check if hovering over equipment
                    let tooltipText = '';
                    if (svgX > 190 && svgX < 210 && svgY > 140 && svgY < 490) {
                        tooltipText = '铁架台 - 用于固定试管';
                    } else if (svgX > 270 && svgX < 460 && svgY > 260 && svgY < 310) {
                        tooltipText = `试管 - 内含${Model.containers.testTube.contents.map(c => Model.reagents[c.reagentId]?.name).join('、') || '空'} | 温度: ${Model.containers.testTube.temperature.toFixed(0)}°C`;
                    } else if (svgX > 275 && svgX < 370 && svgY > 380 && svgY < 465) {
                        tooltipText = Model.equipment.alcoholLamp.lit ? '酒精灯 - 正在加热' : '酒精灯 - 用于加热';
                    } else if (svgX > 560 && svgX < 820 && svgY > 390 && svgY < 505) {
                        tooltipText = '水槽 - 用于排水法收集氧气';
                    } else if (svgX > 655 && svgX < 725 && svgY > 380 && svgY < 490) {
                        tooltipText =
                            `集气瓶 - 水位: ${(Model.containers.gasJar.waterLevel * 100).toFixed(0)}% | O₂: ${(Model.containers.gasJar.oxygenCollected * 1000).toFixed(2)} mmol`;
                    }

                    if (tooltipText) {
                        View.showTooltip(e.clientX, e.clientY, tooltipText);
                    } else {
                        View.hideTooltip();
                    }
                });
            },

            startSimulationLoop() {
                this.lastUpdateTime = Date.now();
                this.simulationInterval = setInterval(() => {
                    const now = Date.now();
                    const dt = (now - this.lastUpdateTime) / 1000;
                    this.lastUpdateTime = now;
                    this.update(dt);
                }, Model.settings.updateInterval);
            },

            update(dt) {
                const tt = Model.containers.testTube;
                const eq = Model.equipment;
                const rx = Model.reactions.kmno4Decomposition;
                const gj = Model.containers.gasJar;
                const ed = Model.experimentData;
                const s = Model.settings;

                // Update time
                ed.timeElapsed += dt;

                // Temperature update
                if (eq.alcoholLamp.lit && eq.alcoholLamp.position === 'underTube') {
                    // Heating
                    const targetTemp = s.maxLampTemp;
                    const heatingAmount = s.heatingRate * dt * eq.alcoholLamp.flameIntensity;
                    tt.temperature = Math.min(tt.temperature + heatingAmount, targetTemp);
                } else {
                    // Cooling
                    const coolingAmount = s.coolingRate * dt;
                    tt.temperature = Math.max(tt.temperature - coolingAmount, s.roomTemp);
                }

                // Update max temperature
                ed.maxTemperature = Math.max(ed.maxTemperature, tt.temperature);

                // KMnO4 decomposition reaction
                const hasKMnO4 = tt.contents.some(c => c.reagentId === 'KMnO4' && c.amount > 0.0001);
                const tempAboveThreshold = tt.temperature >= s.kmno4DecompThreshold;

                if (hasKMnO4 && tempAboveThreshold && rx.progress < 1) {
                    rx.active = true;
                    eq.experimentPhase = 'reacting';

                    // Calculate reaction rate using Arrhenius equation
                    const T_kelvin = tt.temperature + 273.15;
                    const Ea = rx.activationEnergy * 1000; // J/mol
                    const R = rx.gasConstant;
                    const A = rx.frequencyFactor;
                    const k = A * Math.exp(-Ea / (R * T_kelvin));

                    // Scale rate by amount of KMnO4 remaining
                    const kmno4Remaining = tt.contents.find(c => c.reagentId === 'KMnO4')?.amount || 0;
                    const amountFactor = kmno4Remaining / 0.02; // relative to initial
                    rx.rate = k * amountFactor * 0.02;

                    // Update progress
                    const totalKMnO4 = 0.02; // initial amount
                    const consumed = rx.rate * dt;
                    rx.progress = Math.min(rx.progress + consumed / totalKMnO4, 1);

                    // Update KMnO4 amount
                    const kmno4Item = tt.contents.find(c => c.reagentId === 'KMnO4');
                    if (kmno4Item) {
                        kmno4Item.amount = Math.max(kmno4Item.amount - consumed, 0);
                        if (kmno4Item.amount < 0.0001) {
                            tt.contents = tt.contents.filter(c => c.reagentId !== 'KMnO4');
                        }
                    }

                    // Add products
                    const o2Produced = consumed / 2; // 2 KMnO4 -> 1 O2
                    rx.o2Produced += o2Produced;

                    // Add MnO2 (catalyst product)
                    const mno2Produced = consumed / 2;
                    const existingMnO2 = tt.contents.find(c => c.reagentId === 'MnO2');
                    if (existingMnO2) {
                        existingMnO2.amount += mno2Produced;
                    } else {
                        tt.contents.push({ reagentId: 'MnO2', amount: mno2Produced });
                    }

                    // Add K2MnO4
                    const k2mno4Produced = consumed / 2;
                    const existingK2MnO4 = tt.contents.find(c => c.reagentId === 'K2MnO4');
                    if (existingK2MnO4) {
                        existingK2MnO4.amount += k2mno4Produced;
                    } else {
                        tt.contents.push({ reagentId: 'K2MnO4', amount: k2mno4Produced });
                    }

                    // Gas jar collection
                    if (eq.deliveryTube.inGasJar && gj.isCollecting) {
                        gj.oxygenCollected += o2Produced;
                        ed.oxygenCollected += o2Produced;
                        gj.waterLevel = Math.max(0, gj.waterLevel - o2Produced * 5);
                        if (gj.waterLevel < 0.05) {
                            gj.waterLevel = 0;
                            eq.experimentPhase = 'complete';
                        }
                    } else if (eq.deliveryTube.inWater) {
                        // Oxygen goes into water and escapes
                        gj.waterLevel = Math.max(0, gj.waterLevel - o2Produced * 0.3);
                    }

                    if (rx.progress >= 1) {
                        rx.active = false;
                        rx.rate = 0;
                        if (eq.experimentPhase === 'reacting') {
                            eq.experimentPhase = 'complete';
                        }
                        // Remove KMnO4 from contents
                        tt.contents = tt.contents.filter(c => c.reagentId !== 'KMnO4');
                        ed.reactionCompleted = true;
                    }
                } else if (!hasKMnO4 && rx.progress > 0 && rx.progress < 1) {
                    // No KMnO4 left but reaction not complete
                    rx.active = false;
                    rx.rate = 0;
                } else if (hasKMnO4 && !tempAboveThreshold) {
                    rx.active = false;
                    rx.rate = 0;
                    if (rx.progress > 0 && rx.progress < 1) {
                        // Reaction paused due to temperature drop
                    }
                }

                // H2O2 decomposition (for comparison)
                const hx = Model.reactions.h2o2Decomposition;
                const beaker = Model.containers.beaker;
                const hasH2O2 = beaker.contents.some(c => c.reagentId === 'H2O2' && c.amount > 0.001);
                const hasMnO2InBeaker = beaker.contents.some(c => c.reagentId === 'MnO2' && c.amount > 0.0001);

                if (hasH2O2 && hasMnO2InBeaker) {
                    hx.hasCatalyst = true;
                    hx.active = true;
                    // Catalyzed rate
                    hx.rate = 0.0005 * (beaker.contents.find(c => c.reagentId === 'H2O2')?.amount || 0);
                    const h2o2Consumed = hx.rate * dt;
                    const h2o2Item = beaker.contents.find(c => c.reagentId === 'H2O2');
                    if (h2o2Item) {
                        h2o2Item.amount = Math.max(h2o2Item.amount - h2o2Consumed, 0);
                    }
                    hx.o2Produced += h2o2Consumed / 2;
                } else if (hasH2O2 && !hasMnO2InBeaker) {
                    hx.hasCatalyst = false;
                    // Very slow uncatalyzed rate
                    hx.rate = 0.00001;
                    hx.active = false;
                }

                // Alcohol lamp flame intensity animation
                if (eq.alcoholLamp.lit) {
                    eq.alcoholLamp.flameIntensity = 0.7 + Math.random() * 0.3;
                } else {
                    eq.alcoholLamp.flameIntensity = 0;
                }

                // Update temperature history
                ed.temperatureHistory.push({ time: ed.timeElapsed, temp: tt.temperature });
                if (ed.temperatureHistory.length > 500) {
                    ed.temperatureHistory.shift();
                }

                // Render views
                View.render();
            },

            // ===== User Actions =====
            loadKMnO4() {
                const tt = Model.containers.testTube;
                if (tt.contents.length > 0) return;
                const kmno4 = Model.reagents.KMnO4;
                tt.contents.push({ reagentId: 'KMnO4', amount: kmno4.defaultAmount });
                Model.equipment.experimentPhase = 'loaded';
                Model.experimentData.phaseLog.push('装入高锰酸钾');
                View.render();
            },

            placeCotton() {
                if (Model.equipment.cottonPlaced) return;
                if (Model.containers.testTube.contents.length === 0) return;
                Model.equipment.cottonPlaced = true;
                Model.containers.testTube.cottonPlaced = true;
                Model.experimentData.phaseLog.push('放置棉花');
                if (Model.equipment.experimentPhase === 'loaded') {
                    Model.equipment.experimentPhase = 'assembled';
                }
                View.render();
            },

            connectTube() {
                if (Model.equipment.tubeConnected) return;
                if (!Model.equipment.cottonPlaced) return;
                Model.equipment.tubeConnected = true;
                Model.containers.testTube.connectedToTube = true;
                Model.equipment.deliveryTube.inWater = true;
                Model.experimentData.phaseLog.push('连接导管');
                View.render();
            },

            toggleLamp() {
                const eq = Model.equipment;
                if (eq.alcoholLamp.lit) {
                    eq.alcoholLamp.lit = false;
                    eq.alcoholLamp.flameIntensity = 0;
                    if (eq.experimentPhase === 'heating' || eq.experimentPhase === 'reacting') {
                        if (Model.reactions.kmno4Decomposition.progress >= 1) {
                            eq.experimentPhase = 'complete';
                        }
                    }
                    Model.experimentData.phaseLog.push('熄灭酒精灯');
                } else {
                    eq.alcoholLamp.lit = true;
                    eq.alcoholLamp.flameIntensity = 0.8;
                    if (eq.experimentPhase === 'assembled' || eq.experimentPhase === 'loaded') {
                        eq.experimentPhase = 'heating';
                    }
                    Model.experimentData.phaseLog.push('点燃酒精灯');
                }
                View.render();
            },

            startCollection() {
                const eq = Model.equipment;
                if (!eq.tubeConnected || !eq.deliveryTube.inWater) return;
                if (eq.deliveryTube.inGasJar) return;
                eq.deliveryTube.inGasJar = true;
                Model.containers.gasJar.isCollecting = true;
                if (eq.experimentPhase === 'reacting' || eq.experimentPhase === 'heating') {
                    eq.experimentPhase = 'collecting';
                }
                Model.experimentData.phaseLog.push('开始收集氧气');
                View.render();
            },

            stopCollection() {
                const eq = Model.equipment;
                eq.deliveryTube.inGasJar = false;
                Model.containers.gasJar.isCollecting = false;
                if (eq.experimentPhase === 'collecting') {
                    eq.experimentPhase = 'reacting';
                }
                View.render();
            },

            addH2O2() {
                const beaker = Model.containers.beaker;
                if (beaker.contents.some(c => c.reagentId === 'H2O2')) return;
                const h2o2 = Model.reagents.H2O2;
                beaker.contents.push({ reagentId: 'H2O2', amount: h2o2.defaultAmount, concentration: h2o2.concentration });
                Model.experimentData.phaseLog.push('向烧杯中加入H₂O₂');
                View.render();
            },

            addMnO2ToBeaker() {
                const beaker = Model.containers.beaker;
                if (beaker.contents.some(c => c.reagentId === 'MnO2')) return;
                const mno2 = Model.reagents.MnO2;
                beaker.contents.push({ reagentId: 'MnO2', amount: mno2.defaultAmount });
                Model.experimentData.phaseLog.push('向烧杯中加入MnO₂催化剂');
                View.render();
            },

            removeTubeFromWater() {
                const eq = Model.equipment;
                eq.deliveryTube.inWater = false;
                eq.deliveryTube.inGasJar = false;
                Model.containers.gasJar.isCollecting = false;
                Model.experimentData.phaseLog.push('撤出导管');
                if (eq.experimentPhase === 'collecting' || eq.experimentPhase === 'reacting') {
                    eq.experimentPhase = 'complete';
                }
                View.render();
            },

            resetExperiment() {
                // Reset containers
                Model.containers.testTube = {
                    id: 'testTube',
                    name: '试管',
                    contents: [],
                    temperature: 25,
                    volume: 50,
                    maxVolume: 60,
                    cottonPlaced: false,
                    connectedToTube: false
                };
                Model.containers.beaker = {
                    id: 'beaker',
                    name: '烧杯',
                    contents: [],
                    temperature: 25,
                    volume: 250,
                    maxVolume: 300
                };
                Model.containers.gasJar = {
                    id: 'gasJar',
                    name: '集气瓶',
                    contents: [],
                    temperature: 25,
                    volume: 250,
                    maxVolume: 250,
                    oxygenCollected: 0,
                    waterLevel: 1.0,
                    isCollecting: false
                };

                // Reset equipment
                Model.equipment = {
                    alcoholLamp: { lit: false, flameIntensity: 0, position: 'underTube' },
                    ironStand: { assembled: true },
                    ironClamp: { holdingTube: true },
                    tubeConnected: false,
                    deliveryTube: { inWater: false, inGasJar: false },
                    cottonPlaced: false,
                    gasJarInverted: true,
                    experimentPhase: 'idle'
                };

                // Reset reactions
                Model.reactions.kmno4Decomposition = {
                    active: false,
                    progress: 0,
                    rate: 0,
                    startTemp: 25,
                    activationEnergy: 100,
                    frequencyFactor: 1e8,
                    gasConstant: 8.314,
                    o2Produced: 0
                };
                Model.reactions.h2o2Decomposition = {
                    active: false,
                    progress: 0,
                    rate: 0,
                    o2Produced: 0,
                    hasCatalyst: false
                };

                // Reset experiment data
                Model.experimentData = {
                    timeElapsed: 0,
                    oxygenCollected: 0,
                    temperatureHistory: [],
                    maxTemperature: 25,
                    reactionCompleted: false,
                    phaseLog: []
                };

                View.render();
            }
        };

        // =============================================
        // ============= GUIDE TOGGLE ==================
        // =============================================
        function toggleGuide() {
            const content = document.getElementById('guideContent');
            const icon = document.getElementById('guideToggleIcon');
            if (content.style.display === 'none') {
                content.style.display = 'grid';
                icon.textContent = '▾';
            } else {
                content.style.display = 'none';
                icon.textContent = '▸';
            }
        }

        // =============================================
        // ================== INIT =====================
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            Controller.init();
        });

        // Expose Controller to global scope for button onclick
        window.Controller = Controller;
        window.toggleGuide = toggleGuide;

        // Fallback for potential issues
        console.log('🔬 化学实验室模拟器已启动');
        console.log('📋 高锰酸钾制氧气实验');
        console.log('方程式: 2KMnO₄ →(Δ) K₂MnO₄ + MnO₂ + O₂↑');
    </script>
